---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: cert-manager
spec:
  hard:
    requests.ephemeral-storage: "500Mi"
    limits.ephemeral-storage: "4Gi"