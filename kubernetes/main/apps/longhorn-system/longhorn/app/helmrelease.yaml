apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: longhorn
spec:
  releaseName: longhorn
  chart:
    spec:
      chart: longhorn
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      version: 1.7.2
  interval: 5m
  values:
    defaultSettings:
      defaultDataPath: "/var/mnt/longhorn"
    persistence:
      defaultClass: false