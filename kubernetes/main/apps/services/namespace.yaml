---
apiVersion: v1
kind: Namespace
metadata:
  name: services
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    database: allow
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: services
spec:
  hard:
    requests.ephemeral-storage: "500Mi"
    limits.ephemeral-storage: "4Gi"