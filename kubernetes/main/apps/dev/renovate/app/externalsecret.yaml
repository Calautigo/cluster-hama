---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: renovate
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: renovate-secret
    template:
      type: Opaque
      data:
        FORGEJO_API_TOKEN: "{{ .FORGEJO_API_TOKEN }}"
        MEND_RNV_SERVER_API_SECRET: "{{ .RENOVATE_API_SECRET }}"
        MEND_RNV_DATA_HANDLER_TYPE: postgres
        PGDATABASE: &dbName renovate
        PGHOST: &dbHost postgres16-rw.database.svc.cluster.local
        PGPORT: "5432"
        PGUSER: &dbUser "{{ .RENOVATE_POSTGRES_USER }}"
        PGPASSWORD: &dbPass "{{ .RENOVATE_POSTGRES_PASS }}"
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: renovate
    - extract:
        key: cloudnative-pg