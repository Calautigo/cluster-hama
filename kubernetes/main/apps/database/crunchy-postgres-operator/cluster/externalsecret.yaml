---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: &name crunchy-postgres
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store
  target:
    name: crunchy-postgres-secret
    template:
      engineVersion: v2
      data:
        s3.conf: |
          [global]
          repo2-s3-key={{ .BACKBLAZE_CPGO_ACCESS_ID }}
          repo2-s3-key-secret={{ .BACKBLAZE_CPGO_ACCESS_KEY }}
        encryption.conf: |
          [global]
          repo2-cipher-pass={{ .CRUNCHY_POSTGRES_BACKUP_ENCRYPTION_CIPHER }}
  dataFrom:
    - extract:
        key: crunchy-postgres
      rewrite:
        - regexp:
            source: "(.*)"
            target: "CRUNCHY_POSTGRES_$1"
    - extract:
        key: backblaze
      rewrite:
        - regexp:
            source: "[^a-zA-Z0-9 -]"
            target: "_"
        - regexp:
            source: "(.*)"
            target: "BACKBLAZE_$1"