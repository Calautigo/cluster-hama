---
apiVersion: v1
kind: Namespace
metadata:
  name: security
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: security
spec:
  hard:
    requests.ephemeral-storage: "500Mi"
    limits.ephemeral-storage: "4Gi"