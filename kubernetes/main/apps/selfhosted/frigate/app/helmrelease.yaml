---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      frigate:
        annotations:
          reloader.stakater.com/auto: "true"

        # pod:
        #   nodeSelector:
        #     google.feature.node.kubernetes.io/coral: "true"
        #     intel.feature.node.kubernetes.io/gpu: "true"

        containers:
          app:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.14.1

            # env:
            #   LIBVA_DRIVER_NAME: "i965"

            # envFrom:
            #   - secretRef:
            #       name: frigate-secret

            resources:
              requests:
                cpu: 1000m
                memory: 256Mi
                # gpu.intel.com/i915: "1"
              limits:
                memory: 4Gi
                # gpu.intel.com/i915: "1"

            securityContext:
              privileged: true
            probes:
              liveness: &probes
                enabled: true
                spec:
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false

    route:
      app:
        enabled: true
        parentRefs:
          - name: cilium-gateway
            namespace: network
        hostnames:
          - frigate.${SECRET_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - kind: Service
                name: app
                port: http


    service:
      app:
        controller: frigate
        ports:
          http:
            port: 5000

    persistence:
      media:
        existingClaim: frigate-media
        globalMounts:
          - path: /media

      config:
        existingClaim: frigate-config
        globalMounts:
          - path: /config

      config-file:
        type: configMap
        name: frigate-configmap
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
            # readOnly: true

      cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 4Gi
        globalMounts:
          - path: /dev/shm