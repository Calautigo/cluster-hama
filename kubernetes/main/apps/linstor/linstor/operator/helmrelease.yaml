---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linstor-cluster
spec:
  interval: 30m
  releaseName: linstor-cluster
  chart:
    spec:
      chart: linstor-cluster
      version: v1.15.6
      sourceRef:
        kind: HelmRepository
        name: piraeus
        namespace: flux-system
  values:
    controller:
      enabled: true
      replicas: 1

    linstorSatelliteConfigurations:
      - name: nvme-config
        nodeSelector:
          node-role.kubernetes.io/storage: "storage"
        storagePools:
          - name: nvme_pool
            type: lvm
            devicePaths:
              - /dev/nvme0

    piraeusOperator:
      enabled: true
      replicas: 1

    storagePools:
      createDefaultPools: true

    rbac:
      create: true

    nodeSelector: {}
    tolerations: []
    affinity: {}