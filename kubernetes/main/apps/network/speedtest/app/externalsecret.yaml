---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: speedtest-tracker
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: speedtest-tracker-secret
    template:
      type: Opaque
      data:
        DB_DATABASE: &dbName speedtest
        DB_HOST: &dbHost postgres16-rw.database.svc.cluster.local
        DB_USERNAME: &dbUser "{{ .SPEEDTEST_TRACKER_POSTGRES_USER }}"
        DB_PASSWORD: &dbPass "{{ .SPEEDTEST_TRACKER_POSTGRES_PASS }}"
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: speedtest-tracker
    - extract:
        key: cloudnative-pg