apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-secrets
  namespace: flux-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  target:
    name: cluster-secrets
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: cluster-secrets