# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
---
# renovate: datasource=docker depName=ghcr.io/siderolabs/installer
talosVersion: v1.8.1
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.31.1

clusterName: "cluster-hama"
endpoint: https://10.222.0.60:6443
clusterPodNets:
  - "10.69.0.0/16"
clusterSvcNets:
  - "10.96.0.0/16"
additionalApiServerCertSans: &sans
  - "10.222.0.60"
  - 127.0.0.1 # KubePrism
additionalMachineCertSans: *sans

# Disable built-in Flannel to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "kube-control-01"
    ipAddress: ""
    installDisk: "/dev/sda"
    talosImageURL: factory.talos.dev/installer/4520814debfd871f310d8f1c8781ce18567aae73b0857019eec4e33fe303d3d1
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:3b:ad:53"
        dhcp: true
        mtu: 1500
        vip:
          ip: "10.222.0.60"
    extraManifests:
      - config.extra.longhorn.yaml
  - hostname: "kube-control-02"
    ipAddress: ""
    installDisk: "/dev/sda"
    talosImageURL: factory.talos.dev/installer/4520814debfd871f310d8f1c8781ce18567aae73b0857019eec4e33fe303d3d1
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:0e:b9:f5"
        dhcp: true
        mtu: 1500
        vip:
          ip: "10.222.0.60"
    extraManifests:
      - config.extra.longhorn.yaml
  - hostname: "kube-control-03"
    ipAddress: ""
    installDisk: "/dev/sda"
    talosImageURL: factory.talos.dev/installer/4520814debfd871f310d8f1c8781ce18567aae73b0857019eec4e33fe303d3d1
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:c9:47:b0"
        dhcp: true
        mtu: 1500
        vip:
          ip: "10.222.0.60"
    extraManifests:
      - config.extra.longhorn.yaml
  - hostname: "kube-worker-01"
    ipAddress: ""
    installDisk: "/dev/sda"
    talosImageURL: factory.talos.dev/installer/4520814debfd871f310d8f1c8781ce18567aae73b0857019eec4e33fe303d3d1
    controlPlane: false
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:d6:5b:88"
        dhcp: true
        mtu: 1500
    extraManifests:
      - config.extra.longhorn.yaml
  - hostname: "kube-worker-02"
    ipAddress: ""
    installDisk: "/dev/sda"
    talosImageURL: factory.talos.dev/installer/4520814debfd871f310d8f1c8781ce18567aae73b0857019eec4e33fe303d3d1
    controlPlane: false
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:e9:7f:0f"
        dhcp: true
        mtu: 1500
    extraManifests:
      - config.extra.longhorn.yaml
  - hostname: "kube-worker-03"
    ipAddress: ""
    installDisk: "/dev/sda"
    talosImageURL: factory.talos.dev/installer/4520814debfd871f310d8f1c8781ce18567aae73b0857019eec4e33fe303d3d1
    controlPlane: false
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:da:91:90"
        dhcp: true
        mtu: 1500
    extraManifests:
      - config.extra.longhorn.yaml

# Global patches
patches:
  - # Force nameserver
    |-
    machine:
      network:
        nameservers:
          - 10.222.0.1
  - # Configure NTP
    |-
    machine:
      time:
        disabled: false
        servers:
          - 10.222.0.1
  - "@./patches/global/cluster-discovery.yaml"
  - "@./patches/global/containerd.yaml"
  - "@./patches/global/disable-search-domain.yaml"
  - "@./patches/global/hostdns.yaml"
  - "@./patches/global/kubelet.yaml"
  - "@./patches/global/sysctl.yaml"

# Controller patches
controlPlane:
  patches:
    - "@./patches/controller/api-access.yaml"
    - "@./patches/controller/cluster.yaml"
    - "@./patches/controller/disable-admission-controller.yaml"
    - "@./patches/controller/etcd.yaml"

