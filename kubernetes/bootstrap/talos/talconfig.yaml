# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
---
# renovate: datasource=docker depName=ghcr.io/siderolabs/installer
talosVersion: v1.8.1
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.31.1

clusterName: "cluster-hama"
endpoint: https://10.100.0.45:6443
clusterPodNets:
  - "10.69.0.0/16"
clusterSvcNets:
  - "10.96.0.0/16"
additionalApiServerCertSans: &sans
  - "10.100.0.45"
  - 127.0.0.1 # KubePrism
additionalMachineCertSans: *sans

# Disable built-in Flannel to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "k3s-master-01"
    ipAddress: "10.100.0.50"
    installDisk: "/dev/sda"
    talosImageURL: factory.talos.dev/installer/a816565ab2b10f14fb11071963c62c7edee2d864dfcf1ee4f841d3b04c11c9bb
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:3b:ad:53"
        dhcp: false
        addresses:
          - "10.100.0.50/16"
        routes:
          - network: 0.0.0.0/0
            gateway: "10.100.0.1"
        mtu: 1500
        vip:
          ip: "10.100.0.45"
  - hostname: "k3s-master-02"
    ipAddress: "10.100.0.51"
    installDisk: "/dev/sda"
    talosImageURL: factory.talos.dev/installer/a816565ab2b10f14fb11071963c62c7edee2d864dfcf1ee4f841d3b04c11c9bb
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:0e:b9:f5"
        dhcp: false
        addresses:
          - "10.100.0.51/16"
        routes:
          - network: 0.0.0.0/0
            gateway: "10.100.0.1"
        mtu: 1500
        vip:
          ip: "10.100.0.45"
  - hostname: "k3s-master-03"
    ipAddress: "10.100.0.52"
    installDisk: "/dev/sda"
    talosImageURL: factory.talos.dev/installer/a816565ab2b10f14fb11071963c62c7edee2d864dfcf1ee4f841d3b04c11c9bb
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:c9:47:b0"
        dhcp: false
        addresses:
          - "10.100.0.52/16"
        routes:
          - network: 0.0.0.0/0
            gateway: "10.100.0.1"
        mtu: 1500
        vip:
          ip: "10.100.0.45"
  - hostname: "k3s-worker-01"
    ipAddress: "10.100.0.70"
    installDisk: "/dev/sda"
    talosImageURL: factory.talos.dev/installer/a816565ab2b10f14fb11071963c62c7edee2d864dfcf1ee4f841d3b04c11c9bb
    controlPlane: false
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:d6:5b:88"
        dhcp: false
        addresses:
          - "10.100.0.70/16"
        routes:
          - network: 0.0.0.0/0
            gateway: "10.100.0.1"
        mtu: 1500
  - hostname: "k3s-worker-02"
    ipAddress: "10.100.0.71"
    installDisk: "/dev/sda"
    talosImageURL: factory.talos.dev/installer/a816565ab2b10f14fb11071963c62c7edee2d864dfcf1ee4f841d3b04c11c9bb
    controlPlane: false
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:e9:7f:0f"
        dhcp: false
        addresses:
          - "10.100.0.71/16"
        routes:
          - network: 0.0.0.0/0
            gateway: "10.100.0.1"
        mtu: 1500

# Global patches
patches:
  - # Force nameserver
    |-
    machine:
      network:
        nameservers:
          - 10.100.0.1
  - # Configure NTP
    |-
    machine:
      time:
        disabled: false
        servers:
          - 10.100.0.1
  - "@./patches/global/cluster-discovery.yaml"
  - "@./patches/global/containerd.yaml"
  - "@./patches/global/disable-search-domain.yaml"
  - "@./patches/global/hostdns.yaml"
  - "@./patches/global/kubelet.yaml"
  - "@./patches/global/openebs-local.yaml"
  - "@./patches/global/sysctl.yaml"

# Controller patches
controlPlane:
  patches:
    - "@./patches/controller/api-access.yaml"
    - "@./patches/controller/cluster.yaml"
    - "@./patches/controller/disable-admission-controller.yaml"
    - "@./patches/controller/etcd.yaml"

