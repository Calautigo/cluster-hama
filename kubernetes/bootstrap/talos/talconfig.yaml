# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
---
# renovate: datasource=docker depName=ghcr.io/siderolabs/installer
talosVersion: v1.8.3
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.31.1

clusterName: "cluster-hama"
endpoint: https://10.100.0.60:6443
clusterPodNets:
  - "10.69.0.0/16"
clusterSvcNets:
  - "10.96.0.0/16"
additionalApiServerCertSans: &sans
  - "10.100.0.60"
  - 127.0.0.1 # KubePrism
additionalMachineCertSans: *sans

# Disable built-in Flannel to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "kube-control-01"
    ipAddress: "10.100.0.61"
    installDisk: "/dev/sda"
    talosImageURL: factory.talos.dev/installer/d4cf8602b9d285ede53209d5e8c482372d61d3b9aa850736c2dc65bd8d091cba
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:3b:ad:53"
        dhcp: false
        addresses:
          - "10.100.0.61/16"
        routes:
          - network: 0.0.0.0/0
            gateway: "10.100.0.1"
        mtu: 1500
        vip:
          ip: "10.100.0.60"
  - hostname: "kube-control-02"
    ipAddress: "10.100.0.62"
    installDisk: "/dev/sda"
    talosImageURL: factory.talos.dev/installer/d4cf8602b9d285ede53209d5e8c482372d61d3b9aa850736c2dc65bd8d091cba
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:0e:b9:f5"
        dhcp: false
        addresses:
          - "10.100.0.62/16"
        routes:
          - network: 0.0.0.0/0
            gateway: "10.100.0.1"
        mtu: 1500
        vip:
          ip: "10.100.0.60"
  - hostname: "kube-control-03"
    ipAddress: "10.100.0.63"
    installDisk: "/dev/sda"
    talosImageURL: factory.talos.dev/installer/d4cf8602b9d285ede53209d5e8c482372d61d3b9aa850736c2dc65bd8d091cba
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:c9:47:b0"
        dhcp: false
        addresses:
          - "10.100.0.63/16"
        routes:
          - network: 0.0.0.0/0
            gateway: "10.100.0.1"
        mtu: 1500
        vip:
          ip: "10.100.0.60"
  - hostname: "kube-worker-01"
    ipAddress: "10.100.0.71"
    installDisk: "/dev/sda"
    talosImageURL: factory.talos.dev/installer/d4cf8602b9d285ede53209d5e8c482372d61d3b9aa850736c2dc65bd8d091cba
    controlPlane: false
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:d6:5b:88"
        dhcp: false
        addresses:
          - "10.100.0.71/16"
        routes:
          - network: 0.0.0.0/0
            gateway: "10.100.0.1"
        mtu: 1500

# Global patches
patches:
  - # Force nameserver
    |-
    machine:
      network:
        nameservers:
          - 10.100.0.1
  - # Configure NTP
    |-
    machine:
      time:
        disabled: false
        servers:
          - 10.100.0.1
  - "@./patches/global/cluster-discovery.yaml"
  - "@./patches/global/containerd.yaml"
  - "@./patches/global/disable-search-domain.yaml"
  - "@./patches/global/hostdns.yaml"
  - "@./patches/global/kubelet.yaml"
  - "@./patches/global/sysctl.yaml"

# Controller patches
controlPlane:
  patches:
    - "@./patches/controller/api-access.yaml"
    - "@./patches/controller/cluster.yaml"
    - "@./patches/controller/disable-admission-controller.yaml"
    - "@./patches/controller/etcd.yaml"

