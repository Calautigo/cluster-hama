---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg18vec-superuser
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: pg18vec-superuser-secret
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  dataFrom:
    - extract:
        key: cnpg-pg18vec
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg18vec-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: pg18vec-backup-secret
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: versity
        property: ROOT_USER
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: versity
        property: ROOT_PASSWORD
