---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: versity-thestral
spec:
  configuration:
    data:
      compression: bzip2
    destinationPath: s3://cnpg-cluster-thestral/
    endpointURL: http://versity.storage.svc.cluster.local:7070
    s3Credentials:
      accessKeyId:
        name: cloudnative-pg-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: cloudnative-pg-secret
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: bzip2
      maxParallel: 4
  retentionPolicy: 7d
