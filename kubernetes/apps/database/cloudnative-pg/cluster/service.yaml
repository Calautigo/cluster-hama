---
# yaml-language-server: $schema=https://schemas.zinn.ca/v1/service.json
apiVersion: v1
kind: Service
metadata:
  name: &app postgres-db
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/instance: *app
  annotations:
    external-dns.alpha.kubernetes.io/hostname: postgres-db.ds47.dev
    lbipam.cilium.io/ips: "${LB_IP_POSTGRES_DB}"
spec:
  type: LoadBalancer
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    cnpg.io/cluster: postgres
    role: primary
