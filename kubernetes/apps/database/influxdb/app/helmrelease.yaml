---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app influxdb
  namespace: database
spec:
  interval: 5m
  chart:
    spec:
      chart: influxdb2
      interval: 5m
      sourceRef:
        kind: HelmRepository
        name: influxdata-charts
      version: 2.1.2
  values:
    fullnameOverride: *app
    image:
      repository: influxdb
      tag: 2.8.0-alpine
    resources:
      requests:
        cpu: 30m
        memory: 512Mi
      limits:
        memory: 4096Mi
    adminUser:
      create: true
      organization: hamavil
      bucket: default
      user: "admin"
      retention_policy: "0s"
      existingSecret: influxdb-secret
    pdb:
      create: false
    service:
      type: LoadBalancer
      annotations:
        external-dns.alpha.kubernetes.io/hostname: influxdb.schwarz47.at
        lbipam.cilium.io/ips: 10.100.10.207
    persistence:
      enabled: true
      useExisting: true
      name: influxdb-data