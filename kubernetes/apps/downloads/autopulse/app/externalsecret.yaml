---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autopulse
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  target:
    name: autopulse-secret
    creationPolicy: Owner
    template:
      templateFrom:
        - configMap:
            name: autopulse-configmap
            items:
              - key: config.yaml
      data:
        # Postgres Init
        INIT_POSTGRES_HOST: &dbHost pg18vec-rw.database.svc.cluster.local
        INIT_POSTGRES_DBNAME: &dbName autopulse
        INIT_POSTGRES_USER: &dbUser autopulse
        INIT_POSTGRES_PASS: &dbPass "{{ .DB_PASSWORD }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "DB_PASSWORD"
    - extract:
        key: autopulse
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autopulse-initdb
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  target:
    name: autopulse-initdb
  data:
    - secretKey: INIT_POSTGRES_SUPER_PASS
      remoteRef:
        key: cnpg-pg18vec
        property: password
