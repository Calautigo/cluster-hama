---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lazylibrarian
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: lazylibrarian
  dependsOn:
    - name: ceph-csi-rbd
      namespace: storage
  values:
    controllers:
      lazylibrarian:
        pod:
          securityContext:
            # linuxserver s6 image: init must run as root; the app itself drops
            # to PUID/PGID (2000). Do not drop capabilities - s6-setuidgid and
            # lsiown need SETUID/CHOWN to manage the abc user.
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/lazylibrarian
              tag: 1a569c87-ls36@sha256:b8d06dc97585513937a054392f80398d1e3018034e0592f064bde7eede6f128a
            env:
              PUID: "2000"
              PGID: "2000"
              TZ: "${TZ}"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 5299
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - lazylibrarian.ds47.dev
        parentRefs:
          - name: kgateway-internal
            namespace: network

    persistence:
      config:
        existingClaim: lazylibrarian-config
        globalMounts:
          - path: /config
      media:
        type: nfs
        server: 10.100.0.81
        path: /media/media
        globalMounts:
          - path: /media
