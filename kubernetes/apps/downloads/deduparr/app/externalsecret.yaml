---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name deduparr-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        DEDUPARR_RADARR_MAIN_API_KEY: "{{ .RADARR_API_KEY }}"
        DEDUPARR_SONARR_MAIN_API_KEY: "{{ .SONARR_API_KEY }}"
  dataFrom:
    - extract:
        key: arrs
