---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: soularr
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: soularr-secret
    template:
      engineVersion: v2
      data:
        LIDARR_API_KEY: "{{ .LIDARR_API_KEY }}"
        SLSKD_API_KEY: "{{ .SLSK_API_KEY }}"
  dataFrom:
    - extract:
        key: arrs
    - extract:
        key: downloads/slskd
