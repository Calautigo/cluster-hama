---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app stash
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: stash
  dependsOn:
    - name: ceph-csi-rbd
      namespace: storage
  values:
    controllers:
      stash:
        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          app:
            image:
              repository: stashapp/stash
              tag: v0.31.1
            env:
              STASH_STASH: /media/
              STASH_GENERATED: /data/generated/
              STASH_METADATA: /data/metadata/
              STASH_CACHE: /data/cache/
              STASH_PORT: &port 9999
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: stash
        ports:
          http:
            port: *port

    persistence:
      config:
        existingClaim: stash-config
        globalMounts:
          - path: /.stash
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      media:
        type: nfs
        server: 10.100.0.81
        path: /media/media/media/adult
        globalMounts:
          - path: /media
            readOnly: true

    route:
      app:
        hostnames:
          - stash.ds47.dev
        parentRefs:
          - name: kgateway-internal
            namespace: network
