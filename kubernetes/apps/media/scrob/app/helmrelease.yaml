---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app scrob
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: scrob
  values:
    controllers:
      scrob:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4.0@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
            envFrom:
              - secretRef:
                  name: scrob-db
              - secretRef:
                  name: scrob-initdb

        pod:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            fsGroup: 0
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          app:
            image:
              repository: ghcr.io/ellite/scrob
              tag: 1.43.0@sha256:6cadd67c08dab72c3fe1f20cc083ab49cd270d6fcbdbb64a826cd73854d1bb43
            env:
              TZ: "${TZ}"
              PORT: &port 7330
            envFrom:
              - secretRef:
                  name: scrob-secret
              - secretRef:
                  name: scrob-db
            resources:
              requests:
                cpu: 10m
                memory: 150Mi
              limits:
                memory: 8Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - scrob.ds47.dev
        parentRefs:
          - name: kgateway-internal
            namespace: network

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/backend/data
      tmpfs:
        type: emptyDir
        advancedMounts:
          scrob:
            app:
              - path: /tmp
                subPath: tmp
