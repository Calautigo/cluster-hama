---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app navidrome
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: navidrome
  dependsOn:
    - name: ceph-csi-rbd
      namespace: storage
  values:
    controllers:
      navidrome:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"
            supplementalGroups:
              - 65539

        containers:
          app:
            image:
              repository: ghcr.io/navidrome/navidrome
              tag: 0.62.0@sha256:c4b5cb36a790b3eb63ca6a68bbe2fe149c2d7fa2e586f7a480e61db630e6664b
            env:
              TZ: "${TZ}"
              ND_MUSICFOLDER: /music
              ND_DATAFOLDER: /data
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: navidrome
        ports:
          http:
            port: &port 4533

    route:
      app:
        hostnames:
          - navidrome.ds47.dev
        parentRefs:
          - name: kgateway-internal
            namespace: network

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      music:
        type: nfs
        server: 10.100.0.81
        path: /media/media/media/music
        globalMounts:
          - path: /music
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
