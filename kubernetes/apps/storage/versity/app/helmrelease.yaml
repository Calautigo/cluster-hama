---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app versity
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: versity
  install:
    crds: CreateReplace
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    crds: CreateReplace
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/versity/versitygw
              tag: v1.4.0@sha256:6bd4d92bb27ece3097be3c930ea702ebf275288b8711ec91421ccf81d6f36a42
            args: ["posix", "/data"]
            env:
              VGW_HEALTH: /healthz
              VGW_WEBUI_PORT: ":7071"
              VGW_CORS_ALLOW_ORIGIN: "*"
              VGW_WEBUI_GATEWAYS: "https://versity.ds47.dev"
            envFrom:
              - secretRef:
                  name: versity-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 7070
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        ports:
          http:
            port: *port
          ui:
            port: 7071

    route:
      app:
        enabled: true
        parentRefs:
          - name: kgateway-internal
            namespace: network
        hostnames:
          - versity.ds47.dev
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  add:
                    - name: "Access-Control-Allow-Origin"
                      value: "https://versity-ui.ds47.dev"
            backendRefs:
              - kind: Service
                identifier: app
                port: *port        
      ui:
        enabled: true
        parentRefs:
          - name: kgateway-internal
            namespace: network
        hostnames:
          - versity-ui.ds47.dev
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - kind: Service
                identifier: app
                port: 7071

    persistence:
      data:
        type: nfs
        server: 10.100.0.81
        path: /backup/versity
        globalMounts:
          - path: /data