---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
spec:
  interval: 30m
  chart:
    spec:
      chart: frigate
      version: 7.6.0
      sourceRef:
        kind: HelmRepository
        name: blakeblackshear
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    persistence:
      config:
        enabled: true
      media:
        enabled: true
        size: 10Gi
    ingress:
      enabled: true
      ingressClassName: internal
      hosts:
        - host: "frigate.${SECRET_DOMAIN}"
          paths:
            - path: /
              portName: http
    config: |
      mqtt:
        enabled: false
      auth:
        enabled: False
    resources:
      requests:
        cpu: 1000m
        memory: 256Mi
      limits:
        cpu: 4000m
        memory: 1000Mi
