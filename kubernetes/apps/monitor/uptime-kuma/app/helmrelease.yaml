---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
spec:
  interval: 30m
  chart:
    spec:
      chart: uptime-kuma
      version: 2.20.0
      sourceRef:
        kind: HelmRepository
        name: dirsigler
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    ingress:
      enabled: true
      ingressClassName: internal
      hosts:
        - host: "uptime-kuma.${SECRET_DOMAIN}"
          paths:
            - path: /
              pathType: ImplementationSpecific
    volume:
      enabled: true
      accessMode: ReadWriteOnce
      size: 4Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi
