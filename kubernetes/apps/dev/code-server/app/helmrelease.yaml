# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.6.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app code-server
spec:
  chart:
    spec:
      chart: app-template
      version: 3.7.0
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: bjw-s
  interval: 1h
  values:
    controllers:
      code-server:
        containers:
          app:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.96.4@sha256:f93810f7f6636b3af3b1a750faf612349cddb89fbb6d28d69123a214fc75ee9e
              pullPolicy: IfNotPresent
            env:
              DISABLE_TELEMETRY: true

            probes:
              liveness: &probe
                type: HTTP
                path: /health
              readiness: *probe
              startup: *probe
            resources:
              requests:
                cpu: 250m
                memory: 128Mi
              limits:
                cpu: 2000m
                memory: 2Gi

    service:
      code-server:
        controller: *app
        ports:
          http:
            port: &port 8080

    route:
      app:
        enabled: true
        parentRefs:
          - name: cilium-gateway
            namespace: network
        hostnames:
          - code.schwarz47.at
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - kind: Service
                name: *app
                port: *port

    persistence:
      data:
        existingClaim: code-server-storage
        globalMounts:
          - path: /home/coder