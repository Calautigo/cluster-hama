# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.6.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: code-server
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      code-server:
        containers:
          app:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.99.3@sha256:e822acb286dca144f1a10ef847bc8f905d92ea79998f4f021802064badcae5fe
              pullPolicy: IfNotPresent
            env:
              DISABLE_TELEMETRY: true
            probes:
              liveness: &probe
                type: HTTP
                path: /health
              readiness: *probe
              startup: *probe
            resources:
              requests:
                cpu: 250m
                memory: 128Mi
              limits:
                cpu: 2000m
                memory: 2Gi

    service:
      code-server:
        controller: code-server
        ports:
          http:
            port: &port 8080

    persistence:
      data:
        existingClaim: code-server-storage
        globalMounts:
          - path: /home/coder

    route:
      app:
        hostnames:
          - code.schwarz47.at
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: code-server
                port: *port