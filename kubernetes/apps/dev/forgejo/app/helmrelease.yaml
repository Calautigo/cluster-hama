---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
spec:
  interval: 30m
  chart:
    spec:
      chart: forgejo
      version: 10.0.2
      sourceRef:
        kind: HelmRepository
        name: forgejo
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      rootless: true
    gitea:
      config:
        APP_NAME: 'Forgejo: HaMa Git'
      admin:
        existingSecret: forgejo-secret
      service:
        DISABLE_REGISTRATION: true
        REQUIRE_SIGNIN_VIEW: true
        SHOW_REGISTRATION_BUTTON: false

    persistence:
      enabled: true
      size: 10Gi
      accessModes:
        - ReadWriteOnce

    redis-cluster:
      enabled: true

    postgresql-ha:
      enabled: true
      global:
        postgresql:
          existingSecret: postgresql-secret
        pgpool:
          existingSecret: postgresql-secret
      persistence:
        size: 10Gi

    podSecurityContext:
      fsGroup: 1000

    additionalConfigFromEnvs:
      - name: FORGEJO__DATABASE__PASSWD
        valueFrom:
          secretKeyRef:
            name: postgresql-secret
            key: postgres-password
