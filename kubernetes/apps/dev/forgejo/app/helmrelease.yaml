---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo
  interval: 30m
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: uninstall
  uninstall:
    keepHistory: false
  values:
    controllers:
      forgejo:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4.0@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
            envFrom:
              - secretRef:
                  name: forgejo-db
              - secretRef:
                  name: forgejo-initdb
          # Runs pending DB migrations, then registers/refreshes the PocketID
          # OIDC authentication source. The add-oauth call is a no-op after the
          # first successful boot (Forgejo rejects duplicate source names) --
          # if the PocketID client secret ever needs to change, update it via
          # the Forgejo admin UI instead of relying on this container.
          init-oidc:
            image:
              repository: codeberg.org/forgejo/forgejo
              tag: 16.0.0-rootless@sha256:9ff74ea3a61b44c6e2ce3de96950647086ad513d4df81bb024486f71b4d93604
            envFrom:
              - secretRef:
                  name: forgejo-db
              - secretRef:
                  name: forgejo-oidc
            args:
              - /bin/sh
              - -c
              - |
                set -e
                /usr/local/bin/gitea migrate
                /usr/local/bin/gitea admin auth add-oauth \
                  --name pocketid \
                  --provider openidConnect \
                  --key "$OIDC_CLIENT_ID" \
                  --secret "$OIDC_CLIENT_SECRET" \
                  --auto-discover-url "$OIDC_ISSUER_URL/.well-known/openid-configuration" \
                  --scopes "openid profile email groups" \
                  || true
        containers:
          app:
            image:
              repository: codeberg.org/forgejo/forgejo
              tag: 16.0.0-rootless@sha256:9ff74ea3a61b44c6e2ce3de96950647086ad513d4df81bb024486f71b4d93604
            env:
              TZ: ${CONFIG_TIMEZONE}
              FORGEJO__server__ROOT_URL: https://forgejo.ds47.dev
              FORGEJO__server__SSH_DOMAIN: forgejo.ds47.dev
              FORGEJO__server__SSH_LISTEN_PORT: "2222"
              FORGEJO__server__SSH_PORT: "22"
              FORGEJO__service__DISABLE_REGISTRATION: "true"
              FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
              FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
              FORGEJO__oauth2_client__USERNAME: "preferred_username"
            envFrom:
              - secretRef:
                  name: forgejo-db
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: &port 3000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1.5Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
      ssh:
        controller: *app
        ports:
          ssh:
            port: 2222
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.ds47.dev"
        parentRefs:
          - name: kgateway-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      ssh:
        kind: TCPRoute
        parentRefs:
          - name: kgateway-internal
            namespace: network
            sectionName: forgejo-ssh
        rules:
          - backendRefs:
              - identifier: ssh
                port: 2222
    persistence:
      data:
        existingClaim: ${APP}
        globalMounts:
          - path: /var/lib/gitea
