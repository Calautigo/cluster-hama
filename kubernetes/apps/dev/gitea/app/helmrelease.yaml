---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
spec:
  interval: 30m
  chart:
    spec:
      chart: gitea
      version: 10.5.0
      sourceRef:
        kind: HelmRepository
        name: gitea
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    gitea:
      admin:
        existingSecret: gitea-secret
    serviceAccount:
      create: true
      name: gitea-account
    ingress:
      enabled: true
      ingressClassName: internal
      hosts:
        - host: "gitea.${SECRET_DOMAIN}"
          paths:
            - path: /
    postgresql-ha:
      enabled: true
      postgresql:
        auth:
          existingSecret: gitea-secret
          secretKeys:
            adminPasswordKey: postgres-password
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 2000m
        memory: 2Gi
