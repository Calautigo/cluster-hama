# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-db
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: coder-db
    creationPolicy: Owner
    template:
      data:
        # coder's lib/pq driver uses unnamed prepared statements, which
        # transaction-mode pgbouncer cannot support; keep it direct.
        CODER_PG_CONNECTION_URL: "postgres://coder:{{ .DB_PASSWORD }}@pg18vec-rw.database.svc.cluster.local.:5432/coder"
        # --
        INIT_POSTGRES_DBNAME: coder
        INIT_POSTGRES_HOST: pg18vec-rw.database.svc.cluster.local
        INIT_POSTGRES_PASS: "{{ .DB_PASSWORD }}"
        INIT_POSTGRES_USER: coder
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "DB_PASSWORD"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-initdb
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: coder-initdb
  data:
    - secretKey: INIT_POSTGRES_SUPER_PASS
      remoteRef:
        key: cnpg-pg18vec
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: coder-secret
    creationPolicy: Owner
    template:
      data:
        CODER_EXTERNAL_AUTH_0_CLIENT_ID: "{{ .GITHUB_CLIENT_ID }}"
        CODER_EXTERNAL_AUTH_0_CLIENT_SECRET: "{{ .GITHUB_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: dev/coder
