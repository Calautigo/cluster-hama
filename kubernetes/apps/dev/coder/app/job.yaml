apiVersion: batch/v1
kind: Job
metadata:
  name: coder-db-init
spec:
  template:
    spec:
      containers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18.3.0@sha256:6fa1f331cddd2eb0b6afa7b8d3685c864127a81ab01c3d9400bc3ff5263a51cf
          envFrom:
            - secretRef:
                name: coder-db
            - secretRef:
                name: coder-initdb
      restartPolicy: OnFailure