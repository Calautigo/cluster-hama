---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: vikunja
spec:
  name: Vikunja
  allowedUserGroups:
    - name: hama
      namespace: security
  launchUrl: https://vikunja.ds47.dev
  callbackUrls:
    - https://vikunja.ds47.dev/oauth/oidc/callback
  secret:
    name: vikunja-secret
    keys:
      clientID: VIKUNJA_SERVICE_OIDC_CLIENT_ID
      clientSecret: VIKUNJA_SERVICE_OIDC_CLIENT_SECRET
      issuerUrl: VIKUNJA_SERVICE_OIDC_ISSUER
