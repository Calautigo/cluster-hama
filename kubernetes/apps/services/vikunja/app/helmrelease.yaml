---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vikunja
spec:
  chartRef:
    kind: OCIRepository
    name: vikunja
  interval: 30m
  values:
    controllers:
      vikunja:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            envFrom:
              - secretRef:
                  name: vikunja-db
              - secretRef:
                  name: vikunja-initdb
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4.0@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
        containers:
          app:
            image:
              repository: ghcr.io/vikunja/api
              tag: 0.24.3
            env:
              TZ: ${CONFIG_TIMEZONE}
              VIKUNJA_DATABASE_TYPE: postgres
              VIKUNJA_DATABASE_HOST: pg18vec-rw.database.svc.cluster.local
              VIKUNJA_DATABASE_PORT: "5432"
              VIKUNJA_DATABASE_USER: vikunja
              VIKUNJA_DATABASE_DATABASE: vikunja
              VIKUNJA_SERVICE_BASEURL: https://vikunja.ds47.dev
              VIKUNJA_SERVICE_OIDC_PROVIDER_NAME: PocketID
              VIKUNJA_SERVICE_OIDC_SCOPES: openid email profile
              VIKUNJA_SERVICE_OIDC_AUTOLOGIN: "true"
              VIKUNJA_SERVICE_OIDC_REGISTER: "true"
            envFrom:
              - secretRef:
                  name: vikunja-db
              - secretRef:
                  name: vikunja-secret
            probes:
              health:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: 3456
                  periodSeconds: 30
                  timeoutSeconds: 5
    service:
      app:
        controller: vikunja
        ports:
          http:
            port: 3456

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.ds47.dev"
        parentRefs:
          - name: kgateway-internal
            namespace: network

    persistence:
      config:
        existingClaim: ${APP}
        globalMounts:
          - path: /config
