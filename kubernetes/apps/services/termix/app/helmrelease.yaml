---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app termix
spec:
  chartRef:
    kind: OCIRepository
    name: termix
  interval: 30m
  values:
    controllers:
      termix:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          # Image dirs /app/nginx and /app/uploads are owned by uid 1000 in
          # the image; we run as 2000, so mount writable emptyDirs over them
          # and seed /app/nginx with the templates the entrypoint needs.
          init-nginx:
            image:
              repository: ghcr.io/lukegus/termix
              tag: release-1.11.2@sha256:1aeabcb75c70f2171879014c25a08b90164dd7350be86ae45c7eb7d9191a8428
            command:
              - sh
              - -c
              - cp -r /app/nginx/. /nginx-copy/

        containers:
          app:
            image:
              repository: ghcr.io/lukegus/termix
              tag: release-1.11.2@sha256:1aeabcb75c70f2171879014c25a08b90164dd7350be86ae45c7eb7d9191a8428
            env:
              PORT: &port 8080
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 5m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      data:
        existingClaim: termix-data
        globalMounts:
          - path: /app/data
      # /app/nginx is root-owned in the image and the entrypoint regenerates
      # nginx.conf there at startup; emptyDir keeps it writable by uid 2000.
      nginx-conf:
        type: emptyDir
        advancedMounts:
          termix:
            init-nginx:
              - path: /nginx-copy
            app:
              - path: /app/nginx
      # multer writes DB import/export files to /app/uploads; image dir is
      # owned by uid 1000.
      uploads:
        type: emptyDir
        globalMounts:
          - path: /app/uploads

    route:
      app:
        hostnames:
          - termix.ds47.dev
        parentRefs:
          - name: kgateway-internal
            namespace: network

        rules:
          - backendRefs:
              - identifier: app
                port: *port
