---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app obsidian
spec:
  chartRef:
    kind: OCIRepository
    name: obsidian
  interval: 30m
  values:
    controllers:
      obsidian:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # LiveSync CORS config ships as a ConfigMap; the CouchDB entrypoint
          # only merges *.ini from /etc/default.d, so copy it into a writable
          # emptyDir there.
          init-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0
            command:
              - /bin/sh
              - -c
              - cp /tmp/config/*.ini /opt/couchdb/etc/default.d/
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image:
              repository: docker.io/library/couchdb
              tag: 3.5.2@sha256:7219f4799fec01f35adcc445b9333cfd890bf9d2957e0ae32a345017dd0563a4
            env:
              COUCHDB_USER:
                valueFrom:
                  secretKeyRef:
                    name: obsidian-secret
                    key: couchdb-user
              COUCHDB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: obsidian-secret
                    key: couchdb-password
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - curl -sf -u "$COUCHDB_USER:$COUCHDB_PASSWORD" http://localhost:5984/_up
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - curl -sf -u "$COUCHDB_USER:$COUCHDB_PASSWORD" http://localhost:5984/_up
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 5984
        runAsGroup: 5984
        fsGroup: 5984
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: obsidian
        ports:
          http:
            port: &port 5984

    route:
      app:
        hostnames:
          - obsidian.ds47.dev
        parentRefs:
          - name: kgateway-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      config:
        type: configMap
        name: obsidian-configmap
        advancedMounts:
          obsidian:
            init-config:
              - path: /tmp/config
      config-storage:
        type: emptyDir
        globalMounts:
          - path: /opt/couchdb/etc/default.d
      data:
        existingClaim: ${APP}
        advancedMounts:
          obsidian:
            app:
              - path: /opt/couchdb/data
