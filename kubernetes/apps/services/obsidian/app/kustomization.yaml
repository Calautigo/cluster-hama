---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - files:
      - config.ini=./resources/config.ini
    name: obsidian-configmap
generatorOptions:
  disableNameSuffixHash: true
