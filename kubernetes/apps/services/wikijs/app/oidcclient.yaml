---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: wikijs
spec:
  name: Wiki.js
  allowedUserGroups:
    - name: hama
      namespace: security
  launchUrl: https://wiki.ds47.dev
  callbackUrls:
    # Wiki.js generates a per-strategy UUID at creation time and builds the
    # callback as /login/<uuid>/callback, so the exact URL is not known until
    # the strategy exists. Replace this wildcard with the literal URL shown in
    # Administration -> Auth once the strategy has been created.
    - https://wiki.ds47.dev/login/*/callback
  secret:
    name: wikijs-oidc
    keys:
      clientID: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
      issuerUrl: OIDC_ISSUER_URL
