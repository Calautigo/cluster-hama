---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wikijs-db
  namespace: services
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: wikijs-db
    creationPolicy: Owner
    template:
      data:
        DB_TYPE: postgres
        DB_HOST: pg18vec-rw.database.svc.cluster.local
        DB_PORT: "5432"
        DB_NAME: wikijs
        DB_USER: wikijs
        DB_PASS: "{{ .DB_PASSWORD }}"
        # --
        INIT_POSTGRES_DBNAME: wikijs
        INIT_POSTGRES_HOST: pg18vec-rw.database.svc.cluster.local
        INIT_POSTGRES_PASS: "{{ .DB_PASSWORD }}"
        INIT_POSTGRES_USER: wikijs
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "DB_PASSWORD"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wikijs-initdb
  namespace: services
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: wikijs-initdb
  data:
    - secretKey: INIT_POSTGRES_SUPER_PASS
      remoteRef:
        key: cnpg-pg18vec
        property: password
