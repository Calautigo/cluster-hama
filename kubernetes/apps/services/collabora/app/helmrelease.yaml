---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app collabora
spec:
  chartRef:
    kind: OCIRepository
    name: collabora
  interval: 30m
  values:
    controllers:
      collabora:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/collabora/code
              tag: 25.04.9.4.1
            env:
              DONT_GEN_SSL_CERT: "true"
              aliasgroup1: "https://cloud.ds47.dev:443"
              dictionaries: "de_DE en_GB en_US"
              extra_params: "--o:ssl.enable=false --o:ssl.termination=true --o:security.capabilities=false --o:logging.level=warning"
              server_name: "collabora.ds47.dev"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /hosting/discovery
                    port: &port 9980
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                <<: *probe
                spec:
                  httpGet:
                    path: /hosting/discovery
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - collabora.ds47.dev
        parentRefs:
          - name: kgateway-internal
            namespace: network
