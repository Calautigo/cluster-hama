---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: immich-db
    creationPolicy: Owner
    template:
      data:
        DB_HOSTNAME: &dbHost pg18vec-pooler.database.svc.cluster.local
        DB_DATABASE_NAME: &dbName immich
        DB_PASSWORD: &dbPass "{{ .DB_PASSWORD }}"
        DB_USERNAME: &dbUser immich
        # Init container runs CREATE DATABASE/roles; DDL must not go
        # through the transaction-mode pooler.
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: pg18vec-rw.database.svc.cluster.local
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_USER: *dbUser
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "DB_PASSWORD"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-initdb
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: immich-initdb
  data:
    - secretKey: INIT_POSTGRES_SUPER_PASS
      remoteRef:
        key: cnpg-pg18vec
        property: password
