---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
spec:
  parentRefs:
    - name: netbird-public
      namespace: network
  hostnames:
    - photos.ds47.dev
    # schwarz47.at is registered as a validated custom domain on the ds47.dev
    # proxy cluster; keeps existing Immich clients working during migration.
    - photos.schwarz47.at
  rules:
    - backendRefs:
        - name: immich-server
          port: 2283
