---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onlyoffice
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: onlyoffice
  values:
    controllers:
      onlyoffice:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          init-db:
            envFrom:
              - secretRef:
                  name: onlyoffice-db
              - secretRef:
                  name: onlyoffice-initdb
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.3.0@sha256:6fa1f331cddd2eb0b6afa7b8d3685c864127a81ab01c3d9400bc3ff5263a51cf

        containers:
          onlyoffice:
            image:
              repository: docker.io/onlyoffice/documentserver
              tag: 9.3.1
            env:
              WOPI_ENABLED: true
              USE_UNAUTHORIZED_STORAGE: true
              AMQP_URI: amqp://guest:guest@rabbitmq
            envFrom:
              - secretRef:
                  name: onlyoffice-secret
              - secretRef:
                  name: onlyoffice-db
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 4Gi

    service:
      app:
        ports:
          http:
            port: 80

    persistence:
      data:
        existingClaim: onlyoffice-data
        globalMounts:
          - path: /var/www/onlyoffice/Data/certs
          - path: /var/www/onlyoffice/Data
          - path: /var/log/onlyoffice
          - path: /var/lib/onlyoffice/documentserver/App_Data/cache/files
          - path: /var/www/onlyoffice/documentserver-example/public/files
          - path: /usr/share/fonts

    route:
      app:
        hostnames:
          - onlyoffice.ds47.dev
        parentRefs:
          - name: kgateway-internal
            namespace: network