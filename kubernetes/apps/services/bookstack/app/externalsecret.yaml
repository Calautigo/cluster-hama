---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app docmost
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  target:
    name: *app
    creationPolicy: Owner
    template:
      data:
        # App
        APP_SECRET: "{{ .DOCMOST_APP_SECRET }}"
        DATABASE_URL: "postgres://{{ .DOCMOST_POSTGRES_USER }}:{{ .DOCMOST_POSTGRES_PASSWORD }}@postgres17-pgbouncer-rw.database.svc.cluster.local/docmost?sslmode=disable"
        # Postgres Init
        INIT_POSTGRES_DBNAME: docmost
        INIT_POSTGRES_HOST: postgres17-pgbouncer-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .DOCMOST_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .DOCMOST_POSTGRES_PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASSWORD }}"
  dataFrom:
    - extract:
        key: docmost
      rewrite:
        - regexp:
            source: "(.*)"
            target: "DOCMOST_$1"
    - extract:
        key: cloudnative-pg