---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reitti
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  target:
    name: reitti-secret
    creationPolicy: Owner
    template:
      data:
        # Reitti
        POSTGIS_DB: &dbname reitti
        POSTGIS_HOST: &dbhost postgres17-pgbouncer-rw.database.svc.cluster.local
        POSTGIS_PORT: "5432"
        POSTGIS_USER: &dbuser "{{ .POSTGRES_USER }}"
        POSTGIS_PASSWORD: &dbpass "{{ .POSTGRES_PASSWORD }}"
        # Postgres Init
        INIT_POSTGRES_DBNAME: *dbname
        INIT_POSTGRES_HOST: *dbhost
        INIT_POSTGRES_USER: *dbuser
        INIT_POSTGRES_PASS: *dbpass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASSWORD }}"
  dataFrom:
    - extract:
        key: reitti
    - extract:
        key: cloudnative-pg