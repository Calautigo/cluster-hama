---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app reitti
spec:
  releaseName: reitti
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      reitti:

        initContainers:
          01-init-db:
            envFrom: &envFrom
              - secretRef:
                  name: reitti-secret
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 17

        containers:
          app: &reitti
            image:
              repository: dedicatedcode/reitti
              tag: 1.5.0
            env:
              RABBITMQ_HOST: ''
              RABBITMQ_PORT: 5672
              RABBITMQ_USER: 'reitti'
              RABBITMQ_PASSWORD: 'reitti'
              REDIS_HOST: 'dragonfly.database.svc.cluster.local'
              REDIS_PORT: 6379
              PHOTON_BASE_URL: http://photon.services.svc.cluster.local:2322
            envFrom: *envFrom
            resources:
              requests:
                memory: 128Mi
                cpu: 10m
              limits:
                memory: 2Gi
                cpu: 2000m

          rabbitmq:
            image:
              repository: rabbitmq
              tag: 3-management-alpine
            env:
              RABBITMQ_DEFAULT_USER: reitti
              RABBITMQ_DEFAULT_PASS: reitti
            resources:
              requests:
                memory: 128Mi
                cpu: 10m
              limits:
                memory: 1Gi
                cpu: 1000m

    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 8080

    route:
      app:
        hostnames:
          - "reitti.schwarz47.at"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port