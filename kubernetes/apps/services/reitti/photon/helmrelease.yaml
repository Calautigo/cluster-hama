---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app photon
spec:
  releaseName: photon
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      photon:
        containers:
          app: &photon
            image:
              repository: ghcr.io/rtuszik/photon-docker
              tag: 1.0.0
            env:
              REGION: at
              UPDATE_STRATEGY: PARALLEL
              PUID: 2000
              PGID: 2000
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                memory: "128Mi"
              limits:
                memory: "1Gi"
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 2322
    persistence:
      data:
        enabled: true
        existingClaim: *app
        globalMounts:
          - path: /photon/data