---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app oxicloud
spec:
  chartRef:
    kind: OCIRepository
    name: oxicloud
  interval: 30m
  values:
    configMaps:
      oxicloud-initdb:
        data:
          oxicloud.sql: |
            CREATE EXTENSION IF NOT EXISTS "pg_trgm";
            CREATE EXTENSION IF NOT EXISTS "ltree";

    controllers:
      oxicloud:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            envFrom:
              - secretRef:
                  name: oxicloud-db
              - secretRef:
                  name: oxicloud-initdb
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.3.0@sha256:6fa1f331cddd2eb0b6afa7b8d3685c864127a81ab01c3d9400bc3ff5263a51cf
        containers:
          app:
            image:
              repository: diocrafts/oxicloud
              tag: 0.6.0
            env:
              OXICLOUD_BASE_URL: &hostUrl https://cloud.ds47.dev
              OXICLOUD_CHUNK_DIR: /app/cache/chunks
              OXICLOUD_DIRECT_PUT_MAX_BYTES: "1073741824"
              OXICLOUD_OIDC_ADMIN_GROUPS: "hama"
              OXICLOUD_OIDC_AUTO_PROVISION: "true"
              OXICLOUD_OIDC_DISABLE_PASSWORD_LOGIN: "true"
              OXICLOUD_OIDC_ENABLED: "true"
              OXICLOUD_OIDC_FRONTEND_URL: *hostUrl
              OXICLOUD_OIDC_ISSUER_URL: "https://id.ds47.dev"
              OXICLOUD_OIDC_PROVIDER_NAME: "PocketID"
              OXICLOUD_OIDC_REDIRECT_URI: "https://cloud.ds47.dev/api/auth/oidc/callback"
              OXICLOUD_OIDC_SCOPES: "openid profile email groups"
              OXICLOUD_SERVER_HOST: 0.0.0.0
              OXICLOUD_SERVER_PORT: &port 8086
              OXICLOUD_STORAGE_PATH: /app/storage
              OXICLOUD_STATIC_PATH: /app/static
              OXICLOUD_UPLOAD_TMPDIR: /app/cache/tmp
              OXICLOUD_WOPI_DISCOVERY_URL: "https://collabora.ds47.dev/hosting/discovery"
              OXICLOUD_WOPI_ENABLED: "true"
              OXICLOUD_WOPI_PUBLIC_BASE_URL: *hostUrl
              MIMALLOC_ALLOW_LARGE_OS_PAGES: "0"
              MIMALLOC_PURGE_DELAY: "0"
            envFrom:
              - secretRef:
                  name: oxicloud-secret
              - secretRef:
                  name: oxicloud-db
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                <<: *probe
                spec:
                  httpGet:
                    path: /ready
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      data:
        type: nfs
        server: 10.100.0.81
        path: /safe/apps/oxicloud
        advancedMounts:
          oxicloud:
            app:
              - path: /app/storage
      cache:
        existingClaim: oxicloud-cache
        advancedMounts:
          oxicloud:
            app:
              - path: /app/cache/chunks
                subPath: chunks
              - path: /app/cache/tmp
                subPath: tmp
      initdb:
        type: configMap
        identifier: oxicloud-initdb
        advancedMounts:
          oxicloud:
            init-db:
              - path: /initdb

    route:
      app:
        hostnames:
          - cloud.ds47.dev
        parentRefs:
          - name: kgateway-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
