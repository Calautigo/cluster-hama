---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app actual
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: actual
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: ceph-csi-rbd
      namespace: storage
  interval: 1h
  path: ./clusters/thestral/apps/services/actual/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: services
  timeout: 5m
  wait: false