---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpoller
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      unpoller:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/unpoller/unpoller
              tag: v2.7.1@sha256:65e097643e041339f59f2ef65ebcda169a88851dd1451176a0e03314adbf31d7
            env:
              TZ: Europe/Vienna
              UP_UNIFI_DEFAULT_ROLE: homelab
              UP_UNIFI_DEFAULT_URL: https://10.100.10.204:8443
              UP_UNIFI_VERIFY_SSL: "false"
              UP_INFLUXDB_DISABLE: "true"
            envFrom:
              - secretRef:
                  name: unpoller-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 5m
                memory: 36M
              limits:
                memory: 128M
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        ports:
          http:
            port: &port 9130
    serviceMonitor:
      app:
        serviceName: app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 2m # UniFi API only polls at 2m intervals
            scrapeTimeout: 10s
