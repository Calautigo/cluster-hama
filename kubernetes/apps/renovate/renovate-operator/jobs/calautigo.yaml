---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/githubaccesstoken_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: calautigo-assistant-auth-token
spec:
  appID: "2801040"
  installID: "108157913"
  auth:
    privateKey:
      secretRef:
        name: calautigo-assistant-pem # reference secret from step 1.
        key: private_key_pem
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calautigo-assistant-auth-token
spec:
  refreshInterval: "30m0s"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: calautigo-assistant
    template:
      type: Opaque
      engineVersion: v2
      data:
        RENOVATE_TOKEN: "{{ .codeberg_renovate_token }}"
        # Read-only github.com token, used only so changelog lookups for
        # GitHub-hosted dependencies aren't rate limited.
        RENOVATE_GITHUB_COM_TOKEN: "{{ .token }}"
  dataFrom:
    - extract:
        key: codeberg
      rewrite:
        - regexp:
            source: "(.*)"
            target: "codeberg_$1"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: calautigo-assistant-auth-token
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: calautigo
  namespace: renovate
spec:
  provider:
    name: forgejo
    endpoint: &endpoint https://codeberg.org/api/v1/
  discoveryFilters:
    - Calautigo/*
  extraEnv:
    - name: LOG_LEVEL
      value: debug
    - name: RENOVATE_ALLOWED_COMMANDS
      value: '["pnpm run bundle"]'
    - name: RENOVATE_ENDPOINT
      value: *endpoint
    - name: RENOVATE_PLATFORM
      value: forgejo
    - name: RENOVATE_PLATFORM_COMMIT
      value: "true"
  image: ghcr.io/renovatebot/renovate:43.237.0
  parallelism: 5
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  schedule: 0 * * * *
  secretRef: calautigo-assistant
  webhook:
    enabled: true
    authentication:
      enabled: false
