apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: zitadel
  namespace: security
spec:
  interval: 1h
  chart:
    spec:
      chart: zitadel
      version: '7.3.2'
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: security
      interval: 1m
  values:
    replicaCount: 1
    zitadel:
      envVarsSecret: zitadel-secret
      masterkeySecretName: zitadel-secret
      configmapConfig:
        ExternalSecure: false
        TLS:
          Enabled: false
      secretConfig:
        ExternalDomain: sso.schwarz47.at
        ExternalSecure: true
        ExternalPort: 443
        Database:
          postgres:
            Port: 5432
            MaxOpenConns: 40
            MaxIdleConns: 20
            MaxConnLifetime: 30m
            MaxConnIdleTime: 5m
            User:
              SSL:
                Mode: disable
            Admin:
              Username: postgres
              SSL:
                Mode: disable