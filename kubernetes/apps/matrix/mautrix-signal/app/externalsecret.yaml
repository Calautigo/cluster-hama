---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-signal
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: mautrix-signal
    creationPolicy: Owner
    template:
      data:
        # Exposed for the init-db container's DB role password (same value the
        # rendered config.yaml database.uri uses).
        DB_PASSWORD: "{{ .DB_PASSWORD }}"
      templateFrom:
        - configMap:
            name: mautrix-signal-config
            items:
              - key: config.yaml
              - key: registration.yaml
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "DB_PASSWORD"
    # Fixed appservice tokens from Vault (apps/mautrix-signal), providing
    # AS_TOKEN and HS_TOKEN. They must stay stable to match the homeserver's
    # stored appservice registration, and are hex so they can never break the
    # double-quoted YAML scalars in config.yaml / registration.yaml.
    - extract:
        key: mautrix-signal
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "PICKLE_KEY"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "PROVISIONING_SHARED_SECRET"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-signal-initdb
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: mautrix-signal-initdb
  data:
    - secretKey: INIT_POSTGRES_SUPER_PASS
      remoteRef:
        key: cnpg-pg18vec
        property: password
