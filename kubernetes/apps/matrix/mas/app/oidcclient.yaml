---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: mas
spec:
  name: Matrix Authentication Service
  allowedUserGroups:
    - name: hama
      namespace: security
  launchUrl: https://mas.ds47.dev
  callbackUrls:
    # <id> must stay in sync with upstream_oauth2.providers[0].id in
    # resources/config.yaml.tmpl -- MAS requires it to be a ULID.
    - https://mas.ds47.dev/upstream/callback/01KY308DAQAAMXTG5YM0X2YBDK
  secret:
    name: mas-oidc
    keys:
      clientID: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
      issuerUrl: OIDC_ISSUER_URL
