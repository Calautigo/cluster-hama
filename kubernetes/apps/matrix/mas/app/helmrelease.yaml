---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mas
spec:
  chartRef:
    kind: OCIRepository
    name: mas
  interval: 30m
  values:
    controllers:
      mas:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4.0@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
            envFrom:
              - secretRef:
                  name: mas-db
              - secretRef:
                  name: mas-initdb
        containers:
          app:
            image:
              repository: ghcr.io/element-hq/matrix-authentication-service
              tag: 1.20@sha256:1b0cc87ca6bd6186172a123228cfc3be4c94522d5ecc71e7baeaf23e48ce883a
            command:
              - "/usr/local/bin/mas-cli"
            args:
              - "server"
            env:
              MAS_CONFIG: /config/config.yaml
            resources:
              requests:
                cpu: 15m
                memory: 100M
              limits:
                memory: 500Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
          - "mas.ds47.dev"
        parentRefs:
          - name: kgateway-internal
            namespace: network
    persistence:
      config:
        type: secret
        name: mas-secret
