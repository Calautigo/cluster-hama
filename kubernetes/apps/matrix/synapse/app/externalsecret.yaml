---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-db
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: synapse-db
    creationPolicy: Owner
    template:
      data:
        DB_PASSWORD: "{{ .DB_PASSWORD }}"
        # --
        INIT_POSTGRES_DBNAME: synapse
        INIT_POSTGRES_HOST: pg18vec-rw.database.svc.cluster.local
        INIT_POSTGRES_PASS: "{{ .DB_PASSWORD }}"
        INIT_POSTGRES_USER: synapse
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "DB_PASSWORD"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-initdb
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: synapse-initdb
  data:
    - secretKey: INIT_POSTGRES_SUPER_PASS
      remoteRef:
        key: cnpg-pg18vec
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-secrets
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: synapse-secrets
    creationPolicy: Owner
    template:
      data:
        REGISTRATION_SHARED_SECRET: "{{ .REGISTRATION_SHARED_SECRET }}"
        MACAROON_SECRET_KEY: "{{ .MACAROON_SECRET_KEY }}"
        FORM_SECRET: "{{ .FORM_SECRET }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password64
      rewrite:
        - regexp:
            source: "password"
            target: "REGISTRATION_SHARED_SECRET"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password64
      rewrite:
        - regexp:
            source: "password"
            target: "MACAROON_SECRET_KEY"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password64
      rewrite:
        - regexp:
            source: "password"
            target: "FORM_SECRET"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-signal-registration
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: synapse-signal-registration
    creationPolicy: Owner
    template:
      data:
        AS_TOKEN: "{{ .AS_TOKEN }}"
        HS_TOKEN: "{{ .HS_TOKEN }}"
        # Consumed both here (Synapse's app_service_config_files) and directly
        # by the matrix-signal Deployment in the same namespace, so the bridge
        # and homeserver always agree on the same appservice tokens.
        registration.yaml: |
          id: signal
          as_token: "{{ .AS_TOKEN }}"
          hs_token: "{{ .HS_TOKEN }}"
          namespaces:
            users:
              - regex: "@signal_.*:matrix\\.ds47\\.dev"
                exclusive: true
              - regex: "@signalbot:matrix\\.ds47\\.dev"
                exclusive: true
            aliases: []
            rooms: []
          url: "http://matrix-signal.matrix.svc.cluster.local:29328"
          sender_localpart: signalbot
          rate_limited: false
          push_ephemeral: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password64
      rewrite:
        - regexp:
            source: "password"
            target: "AS_TOKEN"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password64
      rewrite:
        - regexp:
            source: "password"
            target: "HS_TOKEN"
