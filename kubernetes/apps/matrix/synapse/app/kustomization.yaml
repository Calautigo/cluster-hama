---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./oidcclient.yaml
configMapGenerator:
  - name: synapse-configmap
    files:
      - ./resources/homeserver.yaml.tmpl
      - ./resources/log_config.yaml
generatorOptions:
  disableNameSuffixHash: true
