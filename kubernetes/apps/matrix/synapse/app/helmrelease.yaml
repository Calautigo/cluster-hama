---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app synapse
spec:
  chartRef:
    kind: OCIRepository
    name: synapse
  interval: 30m
  values:
    controllers:
      synapse:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # homeserver.yaml has no native env-var substitution, so secrets are
          # rendered into the shared /config emptyDir before synapse starts.
          render-config:
            image:
              repository: docker.io/library/alpine
              tag: "3"
            envFrom:
              - secretRef:
                  name: synapse-db
              - secretRef:
                  name: synapse-secrets
            command:
              - /bin/sh
              - -c
              - |
                set -e
                cp /templates/homeserver.yaml.tmpl /config/homeserver.yaml
                cp /templates/log_config.yaml /config/log_config.yaml
                sed -i \
                  -e "s|@@DB_PASSWORD@@|$DB_PASSWORD|g" \
                  -e "s|@@REGISTRATION_SHARED_SECRET@@|$REGISTRATION_SHARED_SECRET|g" \
                  -e "s|@@MACAROON_SECRET_KEY@@|$MACAROON_SECRET_KEY|g" \
                  -e "s|@@FORM_SECRET@@|$FORM_SECRET|g" \
                  /config/homeserver.yaml
          # --generate-keys only creates files referenced by homeserver.yaml
          # that are still missing (i.e. just the signing key on first boot);
          # it must never run again after that or federation signatures break.
          generate-keys:
            image: &synapseImage
              repository: ghcr.io/element-hq/synapse
              tag: latest
            command:
              - python
              - -m
              - synapse.app.homeserver
              - --generate-keys
              - -c
              - /config/homeserver.yaml
        containers:
          app:
            image: *synapseImage
            env:
              TZ: ${CONFIG_TIMEZONE}
              SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8008
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # Image has no USER (defaults to root); nothing here depends on a
        # specific UID, so pick an arbitrary non-root one.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "matrix.ds47.dev"
        parentRefs:
          - name: kgateway-internal
            namespace: network
    persistence:
      data:
        existingClaim: ${APP}
        globalMounts:
          - path: /data
      config:
        type: emptyDir
        globalMounts:
          - path: /config
      templates:
        type: configMap
        name: synapse-configmap
        globalMounts:
          - path: /templates
            readOnly: true
      signal-registration:
        type: secret
        name: synapse-signal-registration
        globalMounts:
          - path: /secrets/signal
            readOnly: true
      mas-shared-secret:
        type: secret
        name: mas-synapse-shared-secret
        globalMounts:
          - path: /secrets/mas
            readOnly: true
