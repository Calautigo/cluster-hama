---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: continuwuity
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: continuwuity
    creationPolicy: Owner
    template:
      templateFrom:
        - configMap:
            name: continuwuity-config
            items:
              - key: conduwuit.toml
  dataFrom:
    # Stable, generated registration token for legacy/token-based signups.
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "registration_token"
    # OIDC client id/secret/issuer from the pocket-id operator's Secret.
    - sourceRef:
        storeRef:
          kind: SecretStore
          name: continuwuity-oidc
      extract:
        key: continuwuity-oidc
