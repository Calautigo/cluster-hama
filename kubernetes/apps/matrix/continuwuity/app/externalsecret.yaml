---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: continuwuity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: continuwuity
    creationPolicy: Owner
    template:
      templateFrom:
        - configMap:
            name: continuwuity-config
            items:
              - key: conduwuit.toml
  data:
    # Stable registration token for legacy/token-based signups (Vault apps/continuwuity).
    - secretKey: registration_token
      remoteRef:
        key: continuwuity
        property: registration_token
  dataFrom:
    # OIDC client id/secret/issuer from the pocket-id operator's Secret.
    - sourceRef:
        storeRef:
          kind: SecretStore
          name: continuwuity-oidc
      extract:
        key: continuwuity-oidc
