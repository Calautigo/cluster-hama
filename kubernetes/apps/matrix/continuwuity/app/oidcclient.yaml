---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: continuwuity
spec:
  name: Continuwuity
  allowedUserGroups:
    - name: hama
      namespace: security
  launchUrl: https://element.ds47.dev
  callbackUrls:
    # continuwuity's OIDC callback path. Verify against the running version and
    # adjust here + in Pocket-ID if login redirects fail.
    - https://matrix.ds47.dev/_continuwuity/oidc/complete
  secret:
    name: continuwuity-oidc
    keys:
      clientID: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
      issuerUrl: OIDC_ISSUER_URL
