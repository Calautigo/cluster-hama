---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: continuwuity-oidc-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: continuwuity-oidc-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: continuwuity-oidc-reader
subjects:
  - kind: ServiceAccount
    name: continuwuity-oidc-reader
    namespace: matrix
roleRef:
  kind: Role
  name: continuwuity-oidc-reader
  apiGroup: rbac.authorization.k8s.io
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: continuwuity-oidc
spec:
  provider:
    # Reads the continuwuity-oidc Secret written by the pocket-id operator,
    # since the OIDC client id/secret live in a k8s Secret rather than Vault.
    kubernetes:
      remoteNamespace: matrix
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: continuwuity-oidc-reader
