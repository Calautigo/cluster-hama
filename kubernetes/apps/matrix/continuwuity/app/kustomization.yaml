---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secretstore.yaml
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./oidcclient.yaml
configMapGenerator:
  - name: continuwuity-config
    files:
      - conduwuit.toml=./resources/conduwuit.toml
generatorOptions:
  disableNameSuffixHash: true
