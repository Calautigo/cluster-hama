---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app element-web
spec:
  chartRef:
    kind: OCIRepository
    name: element-web
  interval: 30m
  values:
    controllers:
      element-web:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/vectorim/element-web
              tag: latest
            env:
              TZ: ${CONFIG_TIMEZONE}
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 80
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              # Entrypoint scripts render /etc/nginx/conf.d/default.conf from
              # a template (envsubst on $ELEMENT_WEB_PORT) on every start, so
              # the root filesystem can't be read-only.
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # Image's Dockerfile sets `USER nginx` (a name, not a UID), so the
        # kubelet can't verify non-root without an explicit numeric UID here.
        # Alpine's nginx package assigns UID/GID 101 to that user.
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "element.ds47.dev"
        parentRefs:
          - name: kgateway-internal
            namespace: network
    persistence:
      config:
        type: configMap
        name: element-web-configmap
        globalMounts:
          - path: /app/config.json
            subPath: config.json
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      var-cache-nginx:
        type: emptyDir
        globalMounts:
          - path: /var/cache/nginx
      var-run:
        type: emptyDir
        globalMounts:
          - path: /var/run
