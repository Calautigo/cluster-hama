---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app element-web
spec:
  chartRef:
    kind: OCIRepository
    name: element-web
  interval: 30m
  values:
    controllers:
      element-web:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/element-hq/element-web
              tag: v1.12.22@sha256:c93f51c0445ce48be5c2d66a61470ba51a78315c7c60a4fc0e791595b96f3a96
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 80
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              # Entrypoint scripts render /etc/nginx/conf.d/default.conf from
              # a template (envsubst on $ELEMENT_WEB_PORT) on every start, so
              # the root filesystem can't be read-only.
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "element.ds47.dev"
        parentRefs:
          - name: kgateway-internal
            namespace: network
    persistence:
      config:
        type: configMap
        name: element-config
        globalMounts:
          - path: /app/config.json
            subPath: config.json
            readOnly: true
