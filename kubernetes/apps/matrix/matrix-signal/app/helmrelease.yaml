---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app matrix-signal
spec:
  chartRef:
    kind: OCIRepository
    name: matrix-signal
  interval: 30m
  values:
    controllers:
      matrix-signal:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # yq's strenv() sets proper YAML string scalars, so generated
          # secrets containing quotes/colons/etc. can't corrupt the file the
          # way plain sed text substitution would.
          render-config:
            image:
              repository: docker.io/mikefarah/yq
              tag: latest
            envFrom:
              - secretRef:
                  name: matrix-signal-db
              - secretRef:
                  name: synapse-signal-registration
            command:
              - /bin/sh
              - -c
              - |
                set -e
                cp /templates/config.yaml.tmpl /config/config.yaml
                yq eval '
                  .database.uri = "postgres://matrix_signal:" + strenv(DB_PASSWORD) + "@pg18vec-rw.database.svc.cluster.local:5432/matrix_signal?sslmode=require" |
                  .appservice.as_token = strenv(AS_TOKEN) |
                  .appservice.hs_token = strenv(HS_TOKEN)
                ' -i /config/config.yaml
        containers:
          app:
            image:
              repository: dock.mau.dev/mautrix/signal
              tag: latest
            command:
              - /usr/bin/mautrix-signal
              - -c
              - /config/config.yaml
              - -r
              - /registration/registration.yaml
            env:
              TZ: ${CONFIG_TIMEZONE}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # Image has no USER (its own entrypoint starts as root and drops to
        # 1337 via su-exec); we bypass that entrypoint via `command:` above,
        # so run as 1337 directly instead.
        runAsUser: 1337
        runAsGroup: 1337
        fsGroup: 1337
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: 29328
    persistence:
      config:
        type: emptyDir
        globalMounts:
          - path: /config
      templates:
        type: configMap
        name: matrix-signal-configmap
        globalMounts:
          - path: /templates
            readOnly: true
      registration:
        type: secret
        name: synapse-signal-registration
        globalMounts:
          - path: /registration
            readOnly: true
