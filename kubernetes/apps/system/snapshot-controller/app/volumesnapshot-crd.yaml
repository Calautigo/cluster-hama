---
# VolumeSnapshot CRD, explicitly managed here because the piraeusdatastore
# snapshot-controller chart does not reliably ship it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api-approved.kubernetes.io: "https://github.com/kubernetes-csi/external-snapshotter/pull/814"
  name: volumesnapshots.snapshot.storage.k8s.io
spec:
  group: snapshot.storage.k8s.io
  names:
    kind: VolumeSnapshot
    listKind: VolumeSnapshotList
    plural: volumesnapshots
    shortNames:
      - vs
    singular: volumesnapshot
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - description: Indicates if the snapshot is ready to be used to restore a volume.
          jsonPath: .status.readyToUse
          name: ReadyToUse
          type: boolean
        - description: Source PVC name.
          jsonPath: .spec.source.persistentVolumeClaimName
          name: SourcePVC
          type: string
        - description: Source VolumeSnapshotContent name.
          jsonPath: .spec.source.volumeSnapshotContentName
          name: SourceSnapshotContent
          type: string
        - description: Minimum volume size required to restore from this snapshot.
          jsonPath: .status.restoreSize
          name: RestoreSize
          type: string
        - description: The VolumeSnapshotClass name.
          jsonPath: .spec.volumeSnapshotClassName
          name: SnapshotClass
          type: string
        - description: Bound VolumeSnapshotContent name.
          jsonPath: .status.boundVolumeSnapshotContentName
          name: SnapshotContent
          type: string
        - description: When the snapshot was taken.
          jsonPath: .status.creationTime
          name: CreationTime
          type: date
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1
      schema:
        openAPIV3Schema:
          description: VolumeSnapshot is a user's request for either creating a point-in-time snapshot of a persistent volume, or binding to a pre-existing snapshot.
          properties:
            spec:
              properties:
                source:
                  properties:
                    persistentVolumeClaimName:
                      type: string
                    volumeSnapshotContentName:
                      type: string
                  type: object
                volumeSnapshotClassName:
                  type: string
              required:
                - source
              type: object
            status:
              properties:
                boundVolumeSnapshotContentName:
                  type: string
                creationTime:
                  format: date-time
                  type: string
                error:
                  properties:
                    message:
                      type: string
                    time:
                      format: date-time
                      type: string
                  type: object
                readyToUse:
                  type: boolean
                restoreSize:
                  type: string
                volumeGroupSnapshotName:
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
