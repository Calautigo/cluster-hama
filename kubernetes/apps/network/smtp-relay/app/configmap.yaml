---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes-configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: smtp-relay-config
data:
  maddy.conf: |
    state_dir /data/state
    runtime_dir /data/run

    hostname smtp.schwarz47.at

    # No cert and no SMTP auth: the ClusterIP Service is the only boundary,
    # so any pod in the cluster can relay through this.
    tls off

    smtp tcp://0.0.0.0:587 {
        default_source {
            modify {
                # Proton only accepts the address its SMTP token was issued
                # for. ".+" leaves the null sender alone so bounces still work.
                replace_sender regexp ".+" "noreply@schwarz47.at"
            }
            deliver_to &remote_queue
        }
    }

    target.queue remote_queue {
        target &remote_smtp
    }

    target.smtp remote_smtp {
        starttls yes
        auth plain {env:SMTP_USERNAME} {env:SMTP_PASSWORD}
        targets tcp://smtp.protonmail.ch:587
    }
