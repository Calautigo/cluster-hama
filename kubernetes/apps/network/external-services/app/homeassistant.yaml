---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: homeassistant
spec:
  type: Static
  static:
    appProtocol: kubernetes.io/ws
    hosts:
      - host: "10.100.0.90"
        port: 8123
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homeassistant
spec:
  hostnames:
    - "hass.ds47.dev"
  parentRefs:
    - name: kgateway-internal
      namespace: network
      sectionName: ds47-dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: gateway.kgateway.dev
          kind: Backend
          name: homeassistant
