---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: multus-music
spec:
  config: |-
    {
      "cniVersion": "1.1.0",
      "name": "multus-music",
      "plugins": [
        {
          "type": "macvlan",
          "master": "ens21",
          "mode": "bridge",
          "capabilities": {
            "ips": true
          },
          "ipam": {
            "type": "static",
            "routes": [
              { "dst": "10.10.40.0/24", "gw": "10.10.40.1" }
            ]
          }
        }
      ]
    }