---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: netbird-public
spec:
  # GatewayClass is created by the netbird-operator chart (gatewayAPI.enabled).
  # netbird-public exposes HTTPRoutes publicly through the NetBird reverse proxy.
  gatewayClassName: netbird-public
  listeners:
    # The listener name selects the NBRoutingPeer (must match its metadata.name).
    - name: axon
      protocol: gateway.netbird.io/NBRoutingPeer
      # Required by the Gateway API schema, unused by the NetBird operator.
      port: 443
