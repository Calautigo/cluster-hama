---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/gatewayclass_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: netbird
spec:
  controllerName: gateway.netbird.io/controller
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: netbird
spec:
  gatewayClassName: netbird
  listeners:
    # The listener name selects the NetworkRouter (must match its metadata.name).
    - name: axon
      protocol: gateway.netbird.io/NetworkRouter
      # Required by the Gateway API schema, unused by the NetBird operator.
      port: 443
