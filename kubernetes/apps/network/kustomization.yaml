---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: network
resources:
  - ./external-dns/ks.yaml
  - ./gateway/ks.yaml
  - ./multus/ks.yaml
  - ./openspeedtest/ks.yaml
  - ./speedtest/ks.yaml
components:
  - ../../components/namespace
  - ../../components/flux/alerts
patches:
  - patch: |
      - op: add
        path: /metadata/name
        value: network
    target:
      kind: Namespace