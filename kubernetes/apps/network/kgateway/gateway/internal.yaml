---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kgateway-internal
  annotations:
    external-dns.alpha.kubernetes.io/target: &hostname gateway-int.ds47.dev
    # Inherited by every HTTPRoute attached to this gateway: gatus alerts on
    # all routes via the gatus-sidecar parent-inheritance feature.
    gatus.home-operations.com/endpoint: |
      alerts:
        - type: pushover
          failure-threshold: 3
          success-threshold: 3
          send-on-resolved: true
      interval: 1m
spec:
  gatewayClassName: kgateway
  addresses:
    - type: IPAddress
      value: &ipv4Address "${LB_IP_KGATEWAY_INTERNAL}"
  infrastructure:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: *hostname
      lbipam.cilium.io/ips: *ipv4Address
    parametersRef:
      name: kgateway-params
      group: gateway.kgateway.dev
      kind: GatewayParameters
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: ds47-dev
      protocol: HTTPS
      port: 443
      hostname: "*.ds47.dev"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: ds47-dev-tls
    # Dedicated to forgejo's git-over-SSH (TCPRoute can't multiplex by
    # hostname/SNI like HTTPRoute, so each TCP backend needs its own port).
    - name: forgejo-ssh
      protocol: TCP
      port: 22
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kgateway-internal
spec:
  jobLabel: kgateway-internal
  namespaceSelector:
    matchNames:
      - network
  podMetricsEndpoints:
    - port: http-monitoring
      path: /metrics
      honorLabels: true
  selector:
    matchLabels:
      app.kubernetes.io/name: kgateway-internal
