---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: gpu-operator
      version: v26.3.3
      sourceRef:
        kind: HelmRepository
        name: nvidia
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Talos provides the NVIDIA proprietary driver and container toolkit via system
    # extensions (nonfree-kmod-nvidia-production, nvidia-container-toolkit-production),
    # so the operator must NOT manage them. Per Talos 1.13 NVIDIA proprietary guide.
    driver:
      enabled: false
    toolkit:
      enabled: false
    hostPaths:
      driverInstallDir: /usr/local
    # NFD is already deployed cluster-wide (kube-system/node-feature-discovery).
    nfd:
      enabled: false
    # Preserve the previous 10x time-slicing (see configmap.yaml).
    devicePlugin:
      config:
        name: time-slicing-config
        default: default
