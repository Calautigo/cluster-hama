---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: deepseek-r1-8b
spec:
  source: pvc://llmkube-models/deepseek-r1-8b/DeepSeek-R1-Distill-Llama-8B-Q4_K_M.gguf
  format: gguf
  quantization: Q4_K_M
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
      layers: 99
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: deepseek-r1-8b
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
spec:
  modelRef: deepseek-r1-8b
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:44cd08334f85c1fcb363e3798302f2986cdb78cdfc8c1cf56bdad44041595a32
  replicas: 1
  priority: normal
  runtimeClassName: nvidia
  nodeSelector:
    feature.node.kubernetes.io/pci-10de.present: "true"
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  contextSize: 16384
  flashAttention: true
  jinja: true
  parallelSlots: 1
  batchSize: 2048
  uBatchSize: 512
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  resources:
    gpu: 1
    cpu: "2"
    memory: 12Gi
  extraArgs:
    - --alias
    - deepseek-r1-8b
    - --cont-batching
    - --cache-prompt
    - --metrics
    - --temp
    - "0.7"
    - --top-p
    - "0.95"
    - --top-k
    - "40"
    - --threads
    - "6"
    - --threads-batch
    - "12"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 180
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
