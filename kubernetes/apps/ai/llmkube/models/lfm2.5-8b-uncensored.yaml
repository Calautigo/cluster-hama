---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: lfm2.5-8b-uncensored
spec:
  source: pvc://llmkube-models/lfm2.5-8b-uncensored/LFM2.5-8B-A1B-Uncensored-Gaston-Q6_K.gguf
  format: gguf
  quantization: Q6_K
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
      layers: 35
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: lfm2.5-8b-uncensored
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
spec:
  modelRef: lfm2.5-8b-uncensored
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:0d6c600a69e8bdaafd7b91ed6db9160906ee8148ee12a609cf4d52b4e17aabe8
  replicas: 0
  priority: normal
  runtimeClassName: nvidia
  nodeSelector:
    feature.node.kubernetes.io/pci-10de.present: "true"
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  contextSize: 16384
  flashAttention: true
  jinja: true
  parallelSlots: 1
  batchSize: 2048
  uBatchSize: 512
  cacheTypeK: q5_0
  cacheTypeV: q5_0
  resources:
    gpu: 1
    cpu: "2"
    memory: 12Gi
  extraArgs:
    - --alias
    - lfm2.5-8b-uncensored
    - --cont-batching
    - --cache-prompt
    - --metrics
    - --temp
    - "0.6"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --threads
    - "6"
    - --threads-batch
    - "12"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 180
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
