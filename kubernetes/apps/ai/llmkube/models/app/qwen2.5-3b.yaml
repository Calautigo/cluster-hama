---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen2.5-3b
spec:
  source: https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf
  format: gguf
  quantization: Q4_K_M
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
      layers: 99
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen2.5-3b
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
spec:
  modelRef: qwen2.5-3b
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:69e0542bd894e378cf8a68d563e035f066f400a5f0190e6585c127ed066f4c2a
  replicas: 1
  priority: normal
  runtimeClassName: nvidia
  nodeSelector:
    feature.node.kubernetes.io/pci-10de.present: "true"
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  contextSize: 32768
  flashAttention: true
  jinja: true
  parallelSlots: 1
  batchSize: 2048
  uBatchSize: 512
  resources:
    gpu: 1
    cpu: "2"
    memory: 8Gi
  extraArgs:
    - --alias
    - qwen2.5-3b
    - --cont-batching
    - --cache-prompt
    - --metrics
    - --temp
    - "0.6"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --threads
    - "6"
    - --threads-batch
    - "12"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 180
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
