---
apiVersion: batch/v1
kind: Job
metadata:
  name: download-deepseek-r1-8b
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: download
          image: python:3.14-slim
          command:
            - /bin/sh
            - -ec
            - |
              set -euo pipefail
              pip install --no-cache-dir "huggingface_hub[hf_xet]"
              mkdir -p /models/deepseek-r1-8b
              hf download Unsloth/DeepSeek-R1-Distill-Llama-8B-GGUF \
                DeepSeek-R1-Distill-Llama-8B-Q4_K_M.gguf \
                --local-dir /models/deepseek-r1-8b
              echo "DeepSeek-R1-8B download complete"
          envFrom:
            - secretRef:
                name: huggingface
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llmkube-models
---
