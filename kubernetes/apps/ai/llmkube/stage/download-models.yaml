---
apiVersion: batch/v1
kind: Job
metadata:
  name: download-gemma-4-e4b
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        feature.node.kubernetes.io/pci-10de.present: "true"
      containers:
        - name: download
          image: python:3.14-slim
          command:
            - /bin/sh
            - -ec
            - |
              set -euo pipefail

              model="/models/gemma-4-e4b/gemma-4-E4B.Q8_0.gguf"
              mmproj="/models/gemma-4-e4b/gemma-4-E4B.mmproj-Q8_0.gguf"
              if [ -s "${model}" ] && [ -s "${mmproj}" ]; then
                echo "Gemma-4-E4B already present at ${model}"
                exit 0
              fi

              pip install --no-cache-dir "huggingface_hub[hf_xet]"
              mkdir -p /models/gemma-4-e4b
              hf download mradermacher/gemma-4-E4B-GGUF \
                gemma-4-E4B.Q8_0.gguf \
                --local-dir /models/gemma-4-e4b
              hf download mradermacher/gemma-4-E4B-GGUF \
                gemma-4-E4B.mmproj-Q8_0.gguf \
                --local-dir /models/gemma-4-e4b
              echo "Gemma-4-E4B download complete"
          envFrom:
            - secretRef:
                name: huggingface
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llmkube-models
