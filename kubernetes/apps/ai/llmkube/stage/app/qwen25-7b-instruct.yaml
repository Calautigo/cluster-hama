---
apiVersion: batch/v1
kind: Job
metadata:
  name: stage-qwen25-7b-instruct
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: stage
          image: python:3.13-slim
          command:
            - /bin/sh
            - -ec
          args:
            - |
              pip install --no-cache-dir "huggingface_hub[hf_xet]"
              mkdir -p /models/qwen25-7b-instruct
              rm -f /models/qwen25-7b-instruct/.cache/huggingface/download/*.lock
              hf download Qwen/Qwen2.5-7B-Instruct-GGUF qwen2.5-7b-instruct-q4_k_m.gguf --local-dir /models/qwen25-7b-instruct
          env:
            - name: HF_XET_CHUNK_CACHE_SIZE_BYTES
              value: "0"
          resources:
            requests:
              cpu: 2
              memory: 4Gi
            limits:
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llmkube-models
