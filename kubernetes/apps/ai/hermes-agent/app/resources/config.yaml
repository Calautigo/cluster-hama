---
model:
  default: gemma-4-e4b
  provider: custom:litellm

custom_providers:
  - name: litellm
    base_url: http://litellm.ai.svc.cluster.local:4000/v1
    key_env: LITELLM_API_KEY

auxiliary:
  vision:
    provider: custom:litellm
    model: gemma-4-e4b

terminal:
  backend: local
  cwd: /opt/data/workspace
  persistent_shell: true

memory:
  memory_enabled: true

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20

web:
  search_backend: searxng
