---
model:
  default: gemma-4-e4b
  provider: custom:gemma

custom_providers:
  - name: gemma
    base_url: http://gemma-4-e4b.ai.svc.cluster.local:8080/v1
    api_key: not-required-local-inference

auxiliary:
  vision:
    provider: custom:gemma
    model: gemma-4-e4b
    base_url: http://gemma-4-e4b.ai.svc.cluster.local:8080/v1

terminal:
  backend: local
  cwd: /opt/data/workspace
  persistent_shell: true

memory:
  memory_enabled: true

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20

web:
  search_backend: searxng
