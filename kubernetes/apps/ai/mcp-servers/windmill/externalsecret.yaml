---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windmill-mcp
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: windmill-mcp-secret
    creationPolicy: Owner
    template:
      data:
        # MCP token generated in Windmill (User settings -> Tokens -> Generate
        # MCP URL). Windmill's gateway accepts it as a Bearer header; the
        # proxy injects this exact value as the Authorization header.
        token: "Bearer {{ .WM_MCP_TOKEN }}"
  data:
    - secretKey: WM_MCP_TOKEN
      remoteRef:
        key: mcps/windmill-mcp
        property: WM_MCP_TOKEN
