---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui
spec:
  # Keep OPENAI_API_KEY in sync with the hermes-agent gateway key (Vault
  # `hermes-agent` entry). "0" left the secret stale after the migration and
  # open-webui failed auth against the gateway.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: open-webui
    creationPolicy: Owner
    template:
      data:
        # App
        WEBUI_SECRET_KEY: "{{ .SECRET_KEY }}"
        OPENAI_API_KEY: "{{ .API_SERVER_KEY }}"
        # Database
        DATABASE_URL: |-
          postgres://open-webui:{{ .DB_PASSWORD }}@pg18vec-rw.database.svc.cluster.local/open-webui
        # Postgres init
        INIT_POSTGRES_HOST: &dbHost pg18vec-rw.database.svc.cluster.local
        INIT_POSTGRES_DBNAME: &dbName open-webui
        INIT_POSTGRES_PASS: &dbPass "{{ .DB_PASSWORD }}"
        INIT_POSTGRES_USER: &dbUser open-webui
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "DB_PASSWORD"
    - extract:
        key: open-webui
    - extract:
        key: hermes-agent
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-initdb
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: open-webui-initdb
  data:
    - secretKey: INIT_POSTGRES_SUPER_PASS
      remoteRef:
        key: cnpg-pg18vec
        property: password
