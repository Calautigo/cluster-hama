---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: windmill
spec:
  interval: 30m
  chart:
    spec:
      chart: windmill
      version: 4.0.233
      sourceRef:
        kind: HelmRepository
        name: windmill
      interval: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    windmill:
      baseDomain: windmill.ds47.dev
      baseProtocol: https
      appReplicas: 2
      # LSP/editor completions server (windmill-extra). 0 disables it.
      extraReplicas: 1
      multiplayerReplicas: 0
      # DATABASE_URL comes from the windmill-db ExternalSecret (key "url");
      # the same secret feeds the postgres-init env vars below.
      databaseUrlSecretName: windmill-db
      databaseUrlSecretKey: url
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          - name: 01-init-db
            image: ghcr.io/home-operations/postgres-init:18.4.0@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
            envFrom: &envFrom
              - secretRef:
                  name: windmill-db
              - secretRef:
                  name: windmill-initdb
          - name: 02-init-grants
            # Windmill's root migration creates the windmill_user /
            # windmill_admin roles itself but needs the app DB user to have
            # CREATEROLE for that; pre-create them as superuser instead.
            image: ghcr.io/home-operations/postgres-init:18.4.0@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
            command:
              - /bin/bash
              - -c
              - |
                #!/bin/bash

                set -o errexit
                set -o nounset

                /var/run/grants.sh
            envFrom: *envFrom
            volumeMounts:
              - name: grants
                readOnly: true
                subPath: grants.sh
                mountPath: /var/run/grants.sh
        volumes:
          - name: grants
            configMap:
              name: windmill-grants
              defaultMode: 509
      workerGroups:
        - name: default
          replicas: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
        - name: native
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
    ingress:
      enabled: false
    postgresql:
      enabled: false
    minio:
      enabled: false
