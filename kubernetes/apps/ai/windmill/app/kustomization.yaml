---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./helmrepository.yaml
  - ./httproute.yaml
  - ./oidcclient.yaml
configMapGenerator:
  - name: windmill-grants
    files:
      - ./resources/grants.sh
generatorOptions:
  disableNameSuffixHash: true
  # grants.sh uses ${INIT_POSTGRES_*} bash vars; stop Flux postBuild
  # substitution from treating them as placeholders.
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
