---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless-gpt
  namespace: ai
spec:
  targetNamespace: ai
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: ceph-csi-rbd
      namespace: storage
    - name: kopiur
      namespace: system
    - name: litellm
      namespace: ai
    - name: paperless
      namespace: services
  components:
    - ../../../../components/kopiur
  path: ./kubernetes/apps/ai/paperless-gpt/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CLAIM: paperless-gpt-data
