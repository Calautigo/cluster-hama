---
use_default_settings:
  engines:
    keep_only:
      - google
      - google images
      - google videos
      - wikipedia
      - mojeek
      - mojeek images
      - qwant
      - qwant images
      - qwant videos
      - startpage
      - startpage images
      - bing images
      - bing videos
      - dailymotion
      - vimeo
      - marginalia
      - wiby
      - searchmysite
      - presearch
      - openstreetmap
      - photon
      - braveapi
      - serper

server:
  limiter: true
  image_proxy: true
  method: GET
  public_instance: false

search:
  autocomplete: duckduckgo
  favicon_resolver: duckduckgo
  languages:
    - all
    - en
    - en-US
  formats:
    - html
    - json

general:
  instance_name: AI Search

ui:
  default_theme: simple
  infinite_scroll: true
  query_in_title: true
  results_on_new_tab: true
  static_use_hash: true
  theme_args:
    simple_style: auto

categories_as_tabs:
  general:
  images:
  videos:
  map:

enabled_plugins:
  - Basic Calculator
  - Hash plugin
  - Open Access DOI rewrite
  - Self Informations
  - Tracker URL remover
  - Unit converter plugin

hostnames:
  high_priority:
    - (.*)\/blog\/(.*)
    - (.*\.)?wikipedia.org$
    - (.*\.)?github.com$
    - (.*\.)?reddit.com$
    - (.*\.)?docker.com$
    - (.*\.)?archlinux.org$
    - (.*\.)?stackoverflow.com$
    - (.*\.)?askubuntu.com$
    - (.*\.)?superuser.com$

engines:
  - name: braveapi
    engine: brave_api
    inactive: false
  - name: serper
    engine: serper
