---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 15m
  dependsOn: []
  values:
    controllers:
      searxng:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 2
        containers:
          app:
            image:
              repository: ghcr.io/searxng/searxng
              tag: 2026.6.16-502c820a2@sha256:e4b44519a9a64208fba7caaaf0261451438146d8881fb63ce4dc539aed201e66
            env:
              SEARXNG_BASE_URL: https://search.ds47.dev
              SEARXNG_PORT: &port 8080
              SEARXNG_REDIS_URL: "redis://searxng-dragonfly.ai.svc.cluster.local:6379"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /stats
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - SETGID
                  - SETUID
                  - DAC_OVERRIDE
    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        hostnames: ["search.ds47.dev"]
        parentRefs:
          - name: kgateway-internal
            namespace: network

    persistence:
      config:
        type: configMap
        name: "{{ .Release.Name }}-configmap"
        globalMounts:
          - path: /etc/searxng/settings.yml
            subPath: settings.yml
            readOnly: true
          - path: /etc/searxng/limiter.toml
            subPath: limiter.toml
            readOnly: true
          - path: /usr/local/searxng/searx/engines/serper.py
            subPath: serper.py
            readOnly: true
          - path: /usr/local/searxng/searx/engines/brave_api.py
            subPath: brave_api.py
            readOnly: true
      tmpfs:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /tmp
