---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: litellm
  values:
    controllers:
      litellm:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/berriai/litellm-non_root
              tag: v1.89.1@sha256:30fb2ef6e077f10ad37f96e29b6180fb158b2f4c226fec3a7fc9b7c57ad043a0
            args: ["--config=/app/config.yaml"]
            env:
              TZ: "${TZ}"
              LITELLM_LOG: "INFO"
              LITELLM_MODE: "PRODUCTION"
              REDIS_HOST: "litellm-dragonfly.ai.svc.cluster.local"
              REDIS_PORT: "6379"
            envFrom:
              - secretRef:
                  name: litellm-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: "/"
                    port: &port 4000
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: "RuntimeDefault"

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "litellm.ds47.dev"
        parentRefs:
          - name: kgateway-internal
            namespace: network

    persistence:
      config:
        type: "configMap"
        name: "litellm-configmap"
        globalMounts:
          - path: "/app/config.yaml"
            subPath: "config.yaml"
            readOnly: true
      tmpfs:
        type: "emptyDir"
        globalMounts:
          - path: "/cache"
            subPath: "cache"
          - path: "/tmp"
            subPath: "tmp"
