---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: litellm
  values:
    image:
      # base image; the -database variant is only needed with a DB
      repository: ghcr.io/berriai/litellm
    # config-only mode: no Postgres, no Redis, no migration job
    db:
      deployStandalone: false
    migrationJob:
      enabled: false
    masterkeySecretName: litellm-secret
    masterkeySecretKey: MASTER_KEY
    environmentSecrets:
      - litellm-secret
    proxy_config:
      model_list:
        - model_name: gemma-4-e4b
          litellm_params:
            model: openai/gemma-4-e4b
            api_base: http://gemma-4-e4b.ai.svc.cluster.local:8080/v1
            # llama.cpp server has no auth; LiteLLM still needs a value
            api_key: sk-local-noauth

        - model_name: kimi-k2.6
          model_info:
            max_input_tokens: 262144
            max_output_tokens: 262144
            supports_function_calling: true
            supports_prompt_caching: true
          litellm_params:
            model: moonshot/kimi-k2.6
            api_base: https://opencode.ai/zen/go/v1
            api_key: os.environ/OPENCODE_GO_API_KEY
            drop_params: true

        - model_name: glm-5.1
          model_info:
            max_input_tokens: 204800
            max_output_tokens: 131072
            supports_function_calling: true
            supports_prompt_caching: true
          litellm_params:
            model: zai/glm-5.1
            api_base: https://opencode.ai/zen/go/v1
            api_key: os.environ/OPENCODE_GO_API_KEY
            drop_params: true

        - model_name: qwen3.6-plus
          model_info:
            max_input_tokens: 991808
            max_output_tokens: 65536
            supports_function_calling: true
            supports_prompt_caching: true
          litellm_params:
            model: dashscope/qwen3.6-plus
            api_base: https://opencode.ai/zen/go/v1
            api_key: os.environ/OPENCODE_GO_API_KEY
            drop_params: true

      general_settings:
        master_key: os.environ/PROXY_MASTER_KEY
      litellm_settings:
        request_timeout: 600
        num_retries: 2
        retry_after: 5
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
