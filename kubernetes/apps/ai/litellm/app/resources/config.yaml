---
model_list:
  - model_name: deepseek-r1-8b
    litellm_params:
      model: "openai/deepseek-r1-8b"
      api_base: "http://deepseek-r1-8b.ai.svc.cluster.local:8080/v1"
      api_key: "not-needed"
      drop_params: true
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 8192
      supports_function_calling: false

  - model_name: llama-3.2-8b
    litellm_params:
      model: "openai/llama-3.2-8b"
      api_base: "http://llama-3.2-8b.ai.svc.cluster.local:8080/v1"
      api_key: "not-needed"
      drop_params: true
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 8192
      supports_function_calling: false

  - model_name: lfm2.5-8b-uncensored
    litellm_params:
      model: "openai/lfm2.5-8b-uncensored"
      api_base: "http://lfm2.5-8b-uncensored.ai.svc.cluster.local:8080/v1"
      api_key: "not-needed"
      drop_params: true
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 8192
      supports_function_calling: false

general_settings:
  health_check_endpoint: "/v1/health"

router_settings:
  routing_strategy: "simple-shuffle"
  redis_host: "os.environ/REDIS_HOST"
  redis_port: "os.environ/REDIS_PORT"

litellm_settings:
  success_callback: ["prometheus"]
  prometheus_adapter: true
  cache: true
  cache_params:
    type: "redis"
    host: "os.environ/REDIS_HOST"
    port: "os.environ/REDIS_PORT"
  drop_params: false
  request_timeout: 600
  num_retries: 2
  retry_after: 5
  set_verbose: false

environment:
  - REDIS_HOST
  - REDIS_PORT
