---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unifi
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      unifi:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: jacobalberty/unifi
              tag: v9.0.114@sha256:d5c9f87e643854bec4d0c15f6cbeec75510a449a7ec46f1e223eded858add480
              pullPolicy: IfNotPresent
            env:
              RUNAS_UID0: "false"
              UNIFI_UID: "1000"
              UNIFI_GID: "1000"
              UNIFI_STDOUT: "true"
              JVM_INIT_HEAP_SIZE:
              JVM_MAX_HEAP_SIZE: 1024M
            resources:
              requests:
                memory: 1Gi
                cpu: 50m
              limits:
                memory: 1250Mi

    service:
      app:
        controller: *app
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        loadBalancerIP: 10.100.55.101
        ports:
          http:
            primary: true
            port: 8080
            protocol: HTTP
          https:
            primary: false
            port: &port 8443
            protocol: HTTPS
          portal-http:
            primary: false
            port: 8880
            protocol: HTTP
          portal-https:
            primary: false
            port: 8843
            protocol: HTTPS
          speedtest:
            primary: true
            port: 6789
            protocol: TCP
          stun:
            primary: true
            port: 3478
            protocol: UDP
          syslog:
            primary: true
            port: 5514
            protocol: UDP
          discovery:
            primary: true
            port: 10001
            protocol: UDP

    route:
      app:
        enabled: true
        parentRefs:
          - name: cilium-gateway
            namespace: network
        hostnames:
          - controller.schwarz47.at
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - kind: Service
                name: app
                port: *port
            timeouts:
              requests: 0s
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  set:
                    - name: X-Forwarded-Proto
                      value: https

    persistence:
      config:
        enabled: true
        existingClaim: unifi-data
        globalMounts:
          - path: /unifi