---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: netbox
  values:
    podAnnotations: &reloader
      reloader.stakater.com/auto: "true"
    worker:
      podAnnotations: *reloader
      replicaCount: 1
      updateStrategy:
        type: Recreate
      affinity: &sharedAffinity
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: netbox
              topologyKey: kubernetes.io/hostname
    housekeeping:
      podAnnotations: *reloader
      affinity: *sharedAffinity
    updateStrategy:
      type: Recreate
    replicaCount: 1
    allowedHosts:
      - netbox.ds47.dev
    csrf:
      trustedOrigins:
        - https://netbox.ds47.dev
    timeZone: Europe/Vienna
    existingSecret: netbox-secret
    superuser:
      existingSecret: netbox-superuser
    persistence:
      enabled: true
      size: 5Gi
    affinity: *sharedAffinity
    httpRoute:
      enabled: true
      parentRefs:
        - name: kgateway-internal
          namespace: network
      hostnames:
        - netbox.ds47.dev
    postgresql:
      enabled: false
    externalDatabase:
      host: pg18vec-rw.database.svc.cluster.local
      port: 5432
      database: netbox
      username: netbox
      existingSecretName: netbox-secret
      existingSecretKey: postgresql-password
    valkey:
      enabled: false
    tasksDatabase:
      host: netbox-dragonfly.home-automation.svc.cluster.local
      port: 6379
      database: 0
    cachingDatabase:
      host: netbox-dragonfly.home-automation.svc.cluster.local
      port: 6379
      database: 1
