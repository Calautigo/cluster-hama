---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nodered
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: nodered
  values:
    controllers:
      nodered:
        containers:
          app:
            image:
              repository: nodered/node-red
              tag: 4.1.11-18-minimal@sha256:41796f01aa3b6c1c163375b53ce4147c613fe98dc1fda316130829ee6c4466da
            env:
              FLOWS: "flows.json"
              NODE_RED_ENABLE_PROJECTS: "true"
              NODE_RED_ENABLE_SAFE_MODE: "false"
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
              limits:
                memory: 1Gi
            securityContext:
              runAsUser: 2000
              runAsGroup: 2000
              runAsNonRoot: true
              fsGroup: 2000
              fsGroupChangePolicy: "OnRootMismatch"

    service:
      app:
        ports:
          http:
            port: 1880

    persistence:
      config:
        existingClaim: nodered-config
        globalMounts:
          - path: /data

    route:
      app:
        hostnames:
          - nodered.ds47.dev
        parentRefs:
          - name: kgateway-internal
            namespace: network

        rules:
          - backendRefs:
              - identifier: app
                port: 1880
