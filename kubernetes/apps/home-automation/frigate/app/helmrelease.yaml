---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      frigate:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.15.0-tensorrt

            env:
              YOLO_MODELS: yolov4-416,yolov7-320

            envFrom:
              - secretRef:
                  name: frigate-secret

            resources:
              requests:
                cpu: 1000m
                memory: 256Mi
                nvidia.com/gpu: "1"
              limits:
                cpu: 8000m
                memory: 6Gi
                nvidia.com/gpu: "1"

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api
                    port: &port 5000
                  initialDelaySeconds: 3000
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false

    route:
      app:
        enabled: true
        parentRefs:
          - name: cilium-gateway
            namespace: network
        hostnames:
          - frigate.schwarz47.at
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - kind: Service
                name: app
                port: http


    service:
      app:
        controller: frigate
        type: LoadBalancer
        externalTrafficPolicy: Local
        loadBalancerIP: 10.100.55.100
        ports:
          http:
            port: 5000
          rtsp:
            enabled: true
            port: 8554

    persistence:
      media:
        existingClaim: frigate-media
        globalMounts:
          - path: /media

      config:
        existingClaim: frigate-config
        globalMounts:
          - path: /config

      config-file:
        type: configMap
        name: frigate-configmap
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
            readOnly: true

      cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 4Gi
        globalMounts:
          - path: /dev/shm