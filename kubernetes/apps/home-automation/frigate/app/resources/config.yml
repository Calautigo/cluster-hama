    # living_room_couch_low: 
    #   rtsp://camera:{{ .FRIGATE_CAMERA_PASSWORD }}@10.10.40.57:554/stream2
    kitchen: rtsp://camera:{{ .FRIGATE_CAMERA_PASSWORD }}@10.10.40.127:554/stream1
    kitchen_low: rtsp://camera:{{ .FRIGATE_CAMERA_PASSWORD }}@10.10.40.127:554/stream2
    garage: rtsp://camera:{{ .FRIGATE_CAMERA_PASSWORD }}@10.10.40.119:554/stream1
    garage_low: rtsp://camera:{{ .FRIGATE_CAMERA_PASSWORD }}@10.10.40.119:554/stream2
    sluice: rtsp://camera:{{ .FRIGATE_CAMERA_PASSWORD }}@10.10.40.140:554/stream1
    sluice_low: rtsp://camera:{{ .FRIGATE_CAMERA_PASSWORD }}@10.10.40.140:554/stream2
    garden_door: rtsp://camera:{{ .FRIGATE_CAMERA_PASSWORD }}@10.10.40.123:554/stream1
    garden_door_low: rtsp://camera:{{ .FRIGATE_CAMERA_PASSWORD }}@10.10.40.123:554/stream2
    garden_chicken: 
