    garden_garden_low: 
      rtsp://admin:{{ .FRIGATE_CAMERA_PASSWORD }}@10.10.40.124:554/h264Preview_01_sub
    garden_sluice_dining: 
      rtsp://admin:{{ .FRIGATE_CAMERA_PASSWORD }}@10.10.40.146:554
    garden_sluice_dining_low: 
      rtsp://admin:{{ .FRIGATE_CAMERA_PASSWORD }}@10.10.40.146:554/h264Preview_01_sub
  webrtc:
    candidates:
      - 10.100.10.203:8555
      - stun:8555
    ice_servers:
      - urls:
         - stun:stun.cloudflare.com:3478

cameras:
  living_room:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/living_room
          input_args: preset-rtsp-restream
          roles: [record]
    live:
      streams:
