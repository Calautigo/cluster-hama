ui:
  time_format: 24hour

logger:
  default: info

auth:
  enabled: false

mqtt:
  host: emqx.database.svc.cluster.local
  port: 1883
  topic_prefix: frigate
  user: "{{ .MQTT_USERNAME }}"
  password: "{{ .MQTT_PASSWORD }}"

database:
  path: /config/frigate.db

ffmpeg:
  global_args: ["-hide_banner", "-loglevel", "warning"]
  hwaccel_args: []
  output_args:
    record: preset-record-generic-audio-aac
    detect: -f rawvideo -pix_fmt yuv420p

detectors:
  ov_0:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

detect:
  enabled: true
  fps: 5

lpr:
  enabled: true
  format: "^[A-Z]{2} [0-9]{3}[A-Z]{2}$"

snapshots:
  enabled: true
  bounding_box: true
  retain:
    default: 14

objects:
  track:
    - person
    - car
    - dog

review:
  alerts:
    labels:
      - car
      - person
  detections:
    labels:
      - person
      - car

record:
  enabled: true
  continuous:
    days: 3
  detections:
    pre_capture: 5
    post_capture: 5
    retain:
      days: 14
      mode: active_objects

go2rtc:
  streams:
    corridor: rtsp://camera:{{ .FRIGATE_CAMERA_PASSWORD }}@10.10.40.143:554/stream1
    corridor_low: 
      rtsp://camera:{{ .FRIGATE_CAMERA_PASSWORD }}@10.10.40.143:554/stream2
    living_room: rtsp://camera:{{ .FRIGATE_CAMERA_PASSWORD }}@10.10.40.136:554/stream1
    living_room_low: 
      rtsp://camera:{{ .FRIGATE_CAMERA_PASSWORD }}@10.10.40.136:554/stream2
    # living_room_couch: 
