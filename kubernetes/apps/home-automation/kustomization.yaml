---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-automation
resources:
  - ./esphome/ks.yaml
  - ./evcc/ks.yaml
  - ./frigate/ks.yaml
  - ./hass-dashboard/ks.yaml
  - ./unifi/ks.yaml
  - ./zigbee2mqtt/ks.yaml
components:
  - ../../components/namespace
patches:
  - patch: |
      - op: add
        path: /metadata/name
        value: home-automation
    target:
      kind: Namespace