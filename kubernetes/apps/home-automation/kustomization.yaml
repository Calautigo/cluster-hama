---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-automation
resources:
  - ./frigate/ks.yaml
  - ./home-assistant/ks.yaml
  - ./unifi/ks.yaml
components:
  - ../../components/namespace
  - ../../components/flux/alerts
patches:
  - patch: |
      - op: add
        path: /metadata/name
        value: home-automation
    target:
      kind: Namespace