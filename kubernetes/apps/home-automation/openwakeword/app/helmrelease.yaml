---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openwakeword
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      openwakeword:
        strategy: RollingUpdate
        rollingUpdate:
          unavailable: 0

        containers:
          app:
            image:
              repository: rhasspy/wyoming-openwakeword
              tag: 1.10.0
            args:
              - --preload-model
              - "ok_nabu"
              # - --custom-model-dir
              # - /custom

    service:
      app:
        controller: openwakeword
        ports:
          http:
            port: 10400

    # persistence:
    #   config:
    #     enabled: true
    #     type: configMap
    #     name: openwakeword
    #     globalMounts:
    #       - path: /custom