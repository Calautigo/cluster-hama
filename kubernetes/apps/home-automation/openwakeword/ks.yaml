---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app openwakeword
  namespace: home-automation
spec:
  targetNamespace: home-automation
  path: ./clusters/thestral/apps/home-automation/openwakeword/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30m
  timeout: 5m
  wait: false
  postBuild:
    substitute:
      APP: *app