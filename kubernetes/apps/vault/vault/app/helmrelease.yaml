---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vault
spec:
  interval: 1h
  chart:
    spec:
      chart: vault
      version: 0.28.1
      sourceRef:
        kind: HelmRepository
        name: hashicorp
      interval: 1h
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    global:
      enabled: true

    injector:
      enabled: false

    csi:
      enabled: false

    ui:
      enabled: true
      serviceType: ClusterIP

    server:
      enabled: true

      image:
        repository: hashicorp/vault
        tag: 1.17.3

      resources:
        requests:
          memory: 256Mi
          cpu: 50m
        limits:
          memory: 512Mi

      readinessProbe:
        enabled: true
        path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204

      livenessProbe:
        enabled: true
        path: /v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200
        initialDelaySeconds: 60

      auditStorage:
        enabled: false

      dataStorage:
        enabled: true
        size: 10Gi
        storageClass: csi-rbd-sc

      serviceAccount:
        create: true
        name: vault

      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: true
          setNodeId: true
          config: |-
            ui = true

            listener "tcp" {
              tls_disable     = 1
              address         = "[::]:8200"
              cluster_address = "[::]:8201"
              telemetry {
                unauthenticated_metrics_access = "true"
              }
            }

            storage "raft" {
              path = "/vault/data"
            }

            service_registration "kubernetes" {}

            telemetry {
              prometheus_retention_time = "30s"
              disable_hostname          = true
            }

            disable_mlock = true
