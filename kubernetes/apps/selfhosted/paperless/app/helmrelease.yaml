---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  interval: 30m
  chart:
    spec:
      chart: paperless-ngx
      version: 0.19.1
      sourceRef:
        kind: HelmRepository
        name: gabe565
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    env:
      TZ: "Europe/Vienna"
      PAPERLESS_URL: "https://paperless.${SECRET_DOMAIN}"
      PAPERLESS_PORT: "8000"
      PAPERLESS_WEBSERVER_WORKERS: "2"
      PAPERLESS_TASK_WORKERS: "2"
      # Configure folders
      PAPERLESS_CONSUMPTION_DIR: /data/local/incoming
      PAPERLESS_DATA_DIR: /data/local/data
      PAPERLESS_EXPORT_DIR: /data/local/export
      PAPERLESS_MEDIA_ROOT: /data/local/media
      # Configure folder importer
      PAPERLESS_CONSUMER_POLLING: "60"
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
      # Configure OCR
      PAPERLESS_OCR_LANGUAGES: deu
      PAPERLESS_OCR_LANGUAGE: deu
      # Configure redis integration
      PAPERLESS_REDIS: redis://paperless-redis.selfhosted.svc.cluster.local:6379
      # Configure user permissions
      USERMAP_GID: "65542"
      PAPERLESS_SECRET_KEY:
        valueFrom:
          secretKeyRef:
            name: paperless-secret
            key: PAPERLESS_SECRET_KEY
      PAPERLESS_ADMIN_USER:
        valueFrom:
          secretKeyRef:
            name: paperless-secret
            key: PAPERLESS_ADMIN_USER
      PAPERLESS_ADMIN_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: paperless-secret
            key: PAPERLESS_ADMIN_PASSWORD

    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: "paperless.${SECRET_DOMAIN}"
            paths:
              - path: /

    persistence:
      data:
        enabled: true
        accessMode: ReadWriteOnce
        size: 1Gi
      media:
        enabled: true
        accessMode: ReadWriteOnce
        size: 20Gi
      export:
        enabled: true
        accessMode: ReadWriteOnce
        size: 1Gi
      consume:
        enabled: true
        accessMode: ReadWriteOnce
        size: 1Gi

    resources:
      requests:
        cpu: 25m
        memory: 1Gi
      limits:
        memory: 4Gi

    postgresql:
      enabled: true
      auth:
        database: paperless-db
        existingSecret: paperless-secret
        secretKeys:
          adminPasswordKey: postgres-password
      primary:
        persistence:
          enabled: true

    redis:
      enabled: true
      auth:
        enabled: true
        username: "paperless-redis"
        existingSecret: paperless-secret
        existingSecretPasswordKey: redis-password
      master:
        persistence:
          enabled: false
      replica:
        replicaCount: 1
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 128Mi
