# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${VOLSYNC_NAME:-${APP}}-volsync-offsite-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: ${VOLSYNC_NAME:-${APP}}-volsync-offsite-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        KOPIA_S3_ENDPOINT: "${VOLSYNC_OFFSITE_S3_ENDPOINT}"
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        KOPIA_REPOSITORY: "s3://${VOLSYNC_OFFSITE_S3_BUCKET}/${VOLSYNC_OFFSITE_S3_PREFIX}/${VOLSYNC_NAME:-${APP}}"
  dataFrom:
    - extract:
        key: s3-offsite
    - extract:
        key: kopia
