---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

set:
  - pipefail
shopt:
  - globstar

includes:
  # flux: .taskfiles/flux/Taskfile.yaml
  # k8s: .taskfiles/k8s/Taskfile.yaml
  bootstrap: .taskfiles/bootstrap/Taskfile.yaml
  # postgres: .taskfiles/postgres/Taskfile.yaml
  # sops: .taskfiles/sops/Taskfile.yaml
  talos: .taskfiles/talos/Taskfile.yaml
  # volsync: .taskfiles/volsync/Taskfile.yaml
  workstation: .taskfiles/workstation/Taskfile.yaml

vars:
  CLUSTER_DIR: "gryffindor/prod"
  K8S_DIR: "{{.ROOT_DIR}}/clusters/{{.CLUSTER_DIR}}"
  KUBECONFIG: "{{.K8S_DIR}}/kubeconfig"
  MINIJINJA_CONFIG_FILE: "{{.ROOT_DIR}}/.minijinja.toml"
  TALOS_DIR: "{{.K8S_DIR}}/talos"
  TALOSCONFIG: "{{.TALOS_DIR}}/clusterconfig/talosconfig"

env:
  ROOT_DIR: "{{.ROOT_DIR}}"
  KUBECONFIG: "{{.KUBECONFIG}}"
  MINIJINJA_CONFIG_FILE: "{{.MINIJINJA_CONFIG_FILE}}"
  TALOS_DIR: "{{.TALOS_DIR}}"
  TALOSCONFIG: "{{.TALOSCONFIG}}"

tasks:
  default:
    silent: true
    cmd: task --list

  noop:
    internal: true
    silent: true
    cmd: noop() { :; }