---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:
  talos:
    desc: Bootstrap Talos
    vars:
      TALOS_CONTROLLER:
        sh: talosctl config info --output json | jq --raw-output '.endpoints[]' | shuf -n 1
    preconditions:
      - which jq minijinja-cli sops talosctl
      - test -f "${TALOSCONFIG}"
      - talosctl config info
    cmds:
      - task: :talos:apply-clusterconfig
        vars:
          INSECURE: "true"
      - until talosctl --nodes {{.TALOS_CONTROLLER}} bootstrap; do sleep 5; done
      - talosctl kubeconfig --nodes {{.TALOS_CONTROLLER}} --force --force-context-name "gryffindor-prod" "${KUBECONFIG}"

  apps:
    desc: Bootstrap Apps
    prompt: Bootstrap apps into Talos cluster?
    preconditions:
      - which helmfile kubectl
      - test -f "${TALOSCONFIG}"
      - test -f {{.K8S_DIR}}/bootstrap/helmfile.yaml
      # - test -f {{.K8S_DIR}}/bootstrap/templates/resources.yaml.j2
      - talosctl config info
    env:
      NODE_COUNT:
        sh: talosctl config info --output json | jq --raw-output '.nodes | length'
    cmds:
      - until kubectl wait nodes --for=condition=Ready=False --all --timeout=10m; do sleep 5; done
      # - minijinja-cli "{{.K8S_DIR}}/bootstrap/templates/resources.yaml.j2" | kubectl apply --server-side --filename -
      - helmfile --kubeconfig "${KUBECONFIG}" --quiet --file {{.K8S_DIR}}/bootstrap/helmfile.yaml apply --skip-diff-on-install --suppress-diff

  vault:
    desc: Bootstrap Vault
    preconditions:
      - which jq minijinja-cli sops talosctl
      - test -f "${TALOSCONFIG}"
    cmds:
      - bash ./scripts/vault-bootstrap.sh
    env:
      VAULT_ADDR: http://vault.vault.svc:8200
      VAULT_TOKEN: '{{.VAULT_TOKEN}}'
    requires:
      vars: ['VAULT_TOKEN']