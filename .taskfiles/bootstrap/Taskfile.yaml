---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'



tasks:
  talos:
    desc: Bootstrap Talos
    vars:
      TALOS_CONTROLLER:
        sh: talosctl config info --output json | jq --raw-output '.endpoints[]' | shuf -n 1
    preconditions:
      - which jq talosctl
      - test -f "${TALOSCONFIG}"
      - talosctl config info
    cmds:
      - task: :talos:apply-clusterconfig
        vars:
          INSECURE: "true"
      - until talosctl --nodes {{.TALOS_CONTROLLER}} bootstrap; do sleep 5; done
      - talosctl kubeconfig --nodes {{.TALOS_CONTROLLER}} --force --force-context-name "gryffindor-prod" "${KUBECONFIG}"

  apps:
    desc: Bootstrap Apps [CLUSTER=gryffindor-prod]
    prompt: Bootstrap apps into Talos cluster?
    preconditions:
      - which helmfile kubectl
      - test -f "${TALOSCONFIG}"
      - test -f {{.KUBERNETES_DIR}}/bootstrap/helmfile.yaml
      - talosctl config info --talosconfig {{.TALOSCONFIG}}
    env:
      NODE_COUNT:
        sh: talosctl config info --output json | jq --raw-output '.nodes | length'
    cmds:
      - until kubectl wait nodes --for=condition=Ready=False --all --timeout=10m; do sleep 5; done
      - helmfile --kubeconfig "${KUBECONFIG}" --quiet --file {{.KUBERNETES_DIR}}/bootstrap/helmfile.yaml apply --skip-diff-on-install --suppress-diff