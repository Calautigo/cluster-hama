---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
spec:
  interval: 30m
  chart:
    spec:
      chart: postgresql-ha
      version: v14.3.5
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: postgresql
    postgresql:
      existingSecret: forgejo-secret
      secretKeys:
        adminPasswordKey: postgres-password
