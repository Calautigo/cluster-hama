---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      minio:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          fix-permissions:
            image:
              repository: ghcr.io/containerd/busybox
              tag: 1.36
            command: ["sh", "-c", "chown -R 1000:1000 /data && chmod u+rxw /data"]
            securityContext:
              runAsUser: 0

        containers:
          app:
            image:
              repository: quay.io/minio/minio
              tag: RELEASE.2025-05-24T17-08-30Z@sha256:a616cd8f37758b0296db62cc9e6af05a074e844cc7b5c0a0e62176d73828d440
            env:
              MINIO_API_CORS_ALLOW_ORIGIN: https://minio.schwarz47.at,https://s3.schwarz47.at
              MINIO_BROWSER_REDIRECT_URL: https://minio.schwarz47.at
              MINIO_PROMETHEUS_JOB_ID: minio
              # MINIO_PROMETHEUS_URL: https://prometheus.schwarz47.at
              MINIO_PROMETHEUS_AUTH_TYPE: public
              MINIO_SERVER_URL: https://s3.schwarz47.at
              MINIO_STORAGE_CLASS_RRS: EC:0
              MINIO_STORAGE_CLASS_STANDARD: EC:0
              MINIO_UPDATE: "off"
            envFrom:
              - secretRef:
                  name: minio-secret
            args: ["server", "/data", "--console-address", ":9001"]
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /minio/health/live
                    port: 9000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: &service minio
        ports:
          http:
            port: &http 9001
          s3:
            port: &s3 9000

    serviceMonitor:
      app:
        serviceName: minio
        endpoints:
          - port: s3
            scheme: http
            path: /minio/v2/metrics/cluster
            interval: 1m
            scrapeTimeout: 10s

    route:
      app:
        enabled: true
        parentRefs:
          - name: cilium-gateway-internal
            namespace: kube-system
        hostnames:
          - minio.schwarz47.at
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - kind: Service
                name: *service
                port: *http
      s3:
        enabled: true
        parentRefs:
          - name: cilium-gateway-internal
            namespace: kube-system
        hostnames:
          - s3.schwarz47.at
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - kind: Service
                name: *service
                port: *s3

    persistence:
      data:
        existingClaim: s3-data
        globalMounts:
          - path: /data