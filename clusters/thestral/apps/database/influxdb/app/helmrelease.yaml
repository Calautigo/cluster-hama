---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: influxdb
  namespace: database
spec:
  chart:
    spec:
      chart: influxdb2
      interval: 5m
      sourceRef:
        kind: HelmRepository
        name: influxdata-charts
      version: 2.1.2
  interval: 5m
  values:
    image:
      repository: influxdb
      tag: 2.8.0-alpine
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 4096Mi
    adminUser:
      organization: "home"
      bucket: "HomeAssistant"
      user: "${INFLUXDB_USERNAME}"
      retention_policy: "0s"
      ## Leave empty to generate a random password and token.
      ## Or fill any of these values to use fixed values.
      password: "${SECRET_INFLUXDB_PASSWORD}"
      token: "${SECRET_INFLUXDB_TOKEN}"
    persistence:
      enabled: true
      useExisting: true
      name: influxdb-data