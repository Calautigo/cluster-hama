---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: externaldns-technitium
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: externaldns-technitium
  values:
    fullnameOverride: externaldns-technitium
    logLevel: info
    podAnnotations:
      secret.reloader.stakater.com/reload: externaldns-technitium-secret
    envFrom:
      - secretRef:
          name: externaldns-technitium-secret
    env:
      - --rfc2136-port=53
      - --rfc2136-tsig-secret-alg=hmac-sha256
      - --rfc2136-tsig-keyname=external-dns
      - --rfc2136-tsig-axfr
    policy: sync
    provider: rfc2136
    serviceMonitor:
      enabled: true
    sources:
      - gateway-httproute
      - gateway-tlsroute
      - service
    txtOwnerId: default
    txtPrefix: external-dns-