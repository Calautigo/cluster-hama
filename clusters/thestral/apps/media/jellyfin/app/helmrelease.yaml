---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: jellyfin
  dependsOn:
    - name: ceph-csi-rbd
      namespace: storage
  values:
    controllers:
      jellyfin:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: jellyfin
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups:
              - 44 # video
              - 109 # render

        containers:
          app:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 10.11.3@sha256:fab30d85f4ec3e19556ca1d91b82b12329fc4a6d2a4b330673354af9218e1d28
            env:
              JELLYFIN_PublishedServerUrl: https://jellyfin.schwarz47.at
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 8Gi
              claims:
                - name: gpu

    service:
      app:
        controller: jellyfin
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - jellyfin.apps.schwarz47.at
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https

    persistence:
      config:
        existingClaim: jellyfin-config

      config-cache:
        existingClaim: jellyfin-cache
        globalMounts:
          - path: /config/metadata
            subPath: metadata
          - path: /config/cache
            subPath: cache
          - path: /config/introskipper
            subPath: introskipper

      tmp:
        type: emptyDir
        advancedMounts:
          jellyfin:
            app:
              - path: /config/log
                subPath: logs
              - path: /cache
                subPath: cache
              - path: /tmp
                subPath: tmp

      media:
        type: nfs
        server: 10.100.0.81
        path: /media/media/media
        advancedMounts:
          jellyfin:
            app:
              - path: /media
                readOnly: true