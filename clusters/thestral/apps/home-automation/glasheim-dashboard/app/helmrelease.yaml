---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: glasheim-dashboard
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: glasheim-dashboard
  values:
    controllers:
      glasheim-dashboard:
        annotations:
          secret.reloader.stakater.com/reload: glasheim-dashboard-secret

        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: git.ds47.dev/calautigo/glasheim-dashboard
              tag: 0.2.0
              pullPolicy: Always

            envFrom:
              - secretRef:
                  name: glasheim-dashboard-secret

            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 80
              readiness: *probe
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      nginx-cache:
        type: emptyDir
        globalMounts:
          - path: /var/cache/nginx
      nginx-run:
        type: emptyDir
        globalMounts:
          - path: /var/run

    route:
      app:
        hostnames:
          - hamavil.ds47.dev
        parentRefs:
          - name: kgateway-internal
            namespace: network