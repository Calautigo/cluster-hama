---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pulse
spec:
  chartRef:
    kind: OCIRepository
    name: pulse
  interval: 30m
  values:
    controllers:
      pulse:
        annotations:
          reloader.stakater.com/auto: "true"
          
        containers:
          app:
            image:
              repository: ghcr.io/rcourtman/pulse
              tag: 5.0.8@sha256:fa33dbd91114a210b09b289803dbe0f5d72860d10be8e8d15e19e6ffaaa70836
            env:
              DISCOVERY_SUBNET: "10.0.0.0/8"
              FRONTEND_PORT: &port 7655
              BACKEND_PORT: *port
              PULSE_PUBLIC_URL: https://pulse.schwarz47.at
            envFrom:
              - secretRef:
                  name: pulse-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data

    route:
      app:
        hostnames:
          - pulse.schwarz47.at
        parentRefs:
          - name: envoy-internal
            namespace: network

        rules:
          - backendRefs:
              - identifier: app
                port: *port