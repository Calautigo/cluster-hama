---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ocis
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: ocis
  values:
    controllers:
      ocis:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/owncloud/ocis
              tag: 7.3.1
            command: [/bin/sh]
            args: ["-c", "ocis init || true; ocis server"]
            env:
              OCIS_INSECURE: true
              OCIS_URL: https://cloud.schwarz47.at
              PROXY_TLS: false
              DEMO_USERS: false
              PROXY_HTTP_ADDR: 0.0.0.0:9200
              OCIS_LOG_LEVEL: info
              OCIS_LOG_COLOR: true
              OCIS_LOG_PRETTY: true
              PROXY_DEBUG_ADDR: 0.0.0.0:9205
              STORAGE_USERS_OCIS_ROOT: /data
              # NOTIFICATIONS_SMTP_HOST: "${SMTP_RELAY_IP}"
              # NOTIFICATIONS_SMTP_PORT: "2525"
              # NOTIFICATIONS_SMTP_SENDER: "ocis@${SECRET_DOMAIN}"
              # NOTIFICATIONS_SMTP_INSECURE: true
              # PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD: none
              # PROXY_OIDC_REWRITE_WELLKNOWN: true
              # PROXY_AUTOPROVISION_ACCOUNTS: true
              # # Auto role assignment
              # # docs: https://doc.owncloud.com/ocis/next/deployment/services/s-list/proxy.html#automatic-role-assignments
              # PROXY_USER_OIDC_CLAIM: "preferred_username"
              # PROXY_ROLE_ASSIGNMENT_DRIVER: oidc
              # WEB_OIDC_SCOPE: "openid profile email groups"
              # PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: ocis_role
            envFrom:
              - secretRef:
                  name: ocis-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: "OnRootMismatch"

    service:
      app:
        controller: ocis
        ports:
          http:
            port: &port 9200
            primary: true
          metrics:
            port: 9205

    serviceMonitor:
      app:
        serviceName: ocis
        endpoints:
          - port: metrics

    route:
      app:
        hostnames:
          - cloud.schwarz47.at
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      storage:
        type: nfs
        server: 10.100.0.81
        path: /cloud
        advancedMounts:
          ocis:
            app:
              - path: /data

      data:
        existingClaim: *app
        globalMounts:
          - path: /etc/ocis
            subPath: config
          - path: /var/lib/ocis
            subPath: data

      config-proxy:
        type: configMap
        name: ocis-configmap
        globalMounts:
          - path: /etc/ocis/proxy.yaml
            subPath: proxy.yaml
            readOnly: true