---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ocis
  namespace: services
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  target:
    name: opencloud-secret
    creationPolicy: Owner
  data:
    - secretKey: idm-admin-password
      remoteRef:
        key: opencloud
        property: password