---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ocis
  namespace: services
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  target:
    name: opencloud-secret
    creationPolicy: Owner
    template: 
      data:
        OC_OIDC_CLIENT_ID: "postgres://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASSWORD }}@immich-rw.database.svc.cluster.local.:5432/immich"
        IDM_ADMIN_PASSWORD: "{{ .password }}"
        STORAGE_USERS_DECOMPOSEDS3_ACCESS_KEY: "0"
        STORAGE_USERS_DECOMPOSEDS3_SECRET_KEY: ""
  dataFrom:
    - extract:
        key: opencloud