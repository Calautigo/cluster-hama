---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencloud
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      opencloud:
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups:
              - 65542 # gladius:external-services

        containers:
          app:
            image:
              repository: opencloudeu/opencloud-rolling
              tag: 4.1.0
            command:
              ["/bin/sh", "-c", "opencloud init || true; opencloud server"]
            env:
              OC_INSECURE: true
              OC_URL: https://cloud.schwarz47.at
              PROXY_TLS: false
              IDM_CREATE_DEMO_USERS: false
              
              GATEWAY_GRPC_ADDR: 0.0.0.0:9142
              OC_ENABLE_OCM: false

              # OIDC
              IDP_DOMAIN: id.schwarz47.at
              OC_OIDC_ISSUER: https://id.schwarz47.at
              
              PROXY_ROLE_ASSIGNMENT_DRIVER: "oidc"
              PROXY_ACCESS_TOKEN_VERIFY_METHOD: "none"
              PROXY_AUTOPROVISION_ACCOUNTS: "true"
              PROXY_AUTOPROVISION_CLAIM_USERNAME: "preferred_username"
              PROXY_USER_OIDC_CLAIM: "preferred_username"
              PROXY_USER_CS3_CLAIM: username

              ## Group assignment
              PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: "groups"
              WEB_OIDC_SCOPE: "openid profile email groups"

              PROXY_OIDC_REWRITE_WELLKNOWN: "true"

              # S3 storage
              STORAGE_USERS_DRIVER: decomposeds3
              STORAGE_SYSTEM_DRIVER: decomposed
              STORAGE_USERS_DECOMPOSEDS3_REGION: default
              STORAGE_USERS_DECOMPOSEDS3_ENDPOINT: http://versity.storage.svc.cluster.local:7070
              STORAGE_USERS_DECOMPOSEDS3_BUCKET: opencloud

              STORAGE_USERS_EVENTS_NUM_CONSUMERS: 5

            envFrom:
              - secretRef:
                  name: opencloud-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        ports:
          http:
            port: 9200

    route:
      app:
        hostnames: ["cloud.schwarz47.at"]
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      data:
        existingClaim: opencloud-data
        globalMounts:
          - path: /var/lib/opencloud
            subPath: data
          - path: /etc/opencloud
            subPath: config

      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp