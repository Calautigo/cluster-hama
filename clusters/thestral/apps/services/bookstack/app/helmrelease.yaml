---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app docmost
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: bookstack
  values:
    controllers:
      docmost:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          01-init-db:
            envFrom: &envFrom
              - secretRef:
                  name: *app
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 17

        containers:
          app:
            image:
              repository: docmost/docmost
              tag: 0.23.2
            env:
              APP_URL: "https://docmost.schwarz47.at"
              MAIL_DRIVER: smtp
              MAIL_FROM_ADDRESS: docmost@schwarz47.at
              MAIL_FROM_NAME: Docmost
              PORT: &port 3000
              REDIS_URL: "redis://docmost-dragonfly:6379"
              # SMTP_HOST: smtp-relay.services.svc.cluster.local
              # SMTP_PORT: 25
            envFrom: *envFrom
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 25m
                memory: 105Mi
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 3000

    route:
      app:
        hostnames:
          - docmost.schwarz47.at
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /app/data/storage