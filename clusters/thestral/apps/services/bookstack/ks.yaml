---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bockstack
  namespace: services
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: bockstack
  components:
    - ../../../../components/volsync
  interval: 1h
  path: "./clusters/thestral/apps/services/bockstack/app"
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: services
  timeout: 5m
  wait: false