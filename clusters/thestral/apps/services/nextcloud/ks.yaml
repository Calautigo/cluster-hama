---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: nextcloud
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: ceph-csi-rbd
      namespace: storage
  interval: 1h
  path: "./clusters/thestral/apps/services/nextcloud/app"
  postBuild:
    substitute:
      APP: nextcloud
      APP_UID: "0"
      APP_GID: "82"
      VOLSYNC_CLAIM: nextcloud
      VOLSYNC_CAPACITY: 15Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: services
  timeout: 5m
  wait: false