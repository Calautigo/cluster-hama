---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: photon
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: photon
  driftDetection:
    mode: enabled
  install:
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    disableWait: true
    remediation:
      retries: 3
  values:
    controllers:
      photon:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          photon:
            image:
              repository: ghcr.io/rtuszik/photon-docker
              tag: 2.0.1@sha256:662b867e99bff395a84a176f0adb1379b7c48c7ea4a45f2e906888daef01a10f
            # command: ["uv"]
            # args: ["run", "-m", "src.process_manager"]
            command: ["sh", "-c"]
            args: ["sleep infinity"]
            env:
              PGID: 2000
              PUID: 2000
              UPDATE_STRATEGY: PARALLEL
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: 2322
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: 2322
                  failureThreshold: 720
            resources:
              requests:
                memory: 1024Mi
              limits:
                memory: 10Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: false
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch

    service:
      photon:
        controller: photon
        ports:
          http:
            port: 2322

    persistence:
      cache:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /.cache
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 300Gi
        storageClass: csi-rbd-sc
        globalMounts:
          - path: /photon/data
            
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: photon
            patch: |
              - op: add
                path: /spec/progressDeadlineSeconds
                value: 7200