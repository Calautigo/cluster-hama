---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filebrowser
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  target:
    name: filebrowser-secret
    creationPolicy: Owner
    template:
      data:
        # Filebrowser
        FILEBROWSER_JWT_TOKEN_SECRET: "{{ .JWT_SECRET }}"
        FILEBROWSER_OIDC_CLIENT_ID: "{{ .CLIENT_ID }}"
        FILEBROWSER_OIDC_CLIENT_SECRET: "{{ .CLIENT_SECRET }}"

        # Immich config
        config.yaml: |
          server:
            port: 80
            cacheDir: "/tmp"
            database: "/config/database.db"
            sources:
              - path: "/data"
                config:
                  defaultEnabled: true

          auth:
            methods:
              password:
                enabled: false
              oidc:
                enabled: true
                issuerUrl: "https://id.schwarz47.at"
                scopes: "email openid profile groups"
                userIdentifier: "preferred_username"
                createUser: true
                adminGroup: "core"
                groupsClaim: "groups"

          frontend:
            name: "HaMa Cloud"

  dataFrom:
    - extract:
        key: filebrowser
