---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app filebrowser
spec:
  chartRef:
    kind: OCIRepository
    name: filebrowser
  interval: 30m
  values:
    controllers:
      filebrowser:
        annotations:
          reloader.stakater.com/auto: "true"
          
        containers:
          app:
            image:
              repository: ghcr.io/gtsteffaniak/filebrowser
              tag: 1.2.2-stable@sha256:0e8f0841fe731ef82db285af510e61fed7ad0a7622bf8d39ca6f3492930f8b58
            env:
              PORT: &port 80
              FILEBROWSER_CONFIG: "/config/config.yaml"
            envFrom:
              - secretRef:
                  name: filebrowser-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      config:
        type: secret
        name: filebrowser-secret
        advancedMounts:
          filebrowser:
            app:
              - path: /config/config.yaml
                subPath: config.yaml
                readOnly: true
      configdir:
        existingClaim: *app
        globalMounts:
          - path: /config

      shared:
        type: nfs
        server: 10.100.0.81
        path: /safe/shared
        globalMounts:
          - path: /data/shared

      hama:
        type: nfs
        server: 10.100.0.81
        path: /safe/hama
        globalMounts:
          - path: /data/hama

      users:
        type: nfs
        server: 10.100.0.81
        path: /safe/users
        globalMounts:
          - path: /data/users

      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      app:
        hostnames:
          - cloud.ds47.dev
        parentRefs:
          - name: kgateway-internal
            namespace: network