apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-rbd
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://ceph.github.io/csi-charts
      chart: ceph-csi-rbd
      version: 3.15.1
      sourceRef:
        kind: HelmRepository
        name: ceph-csi
      interval: 5m
  #See https://github.com/ceph/ceph-csi/blob/devel/charts/ceph-csi-rbd/values.yaml
  values:
    csiConfig:
      - clusterID: "394577ce-72a4-47f6-a132-f83e841482fe"
        monitors:
        - 10.44.0.51:6789
        - 10.44.0.52:6789
        - 10.44.0.54:6789
        - 10.44.0.57:6789

    controller:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

    nodeplugin:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

    storageClass:
      create: true
      clusterID: "394577ce-72a4-47f6-a132-f83e841482fe"
      pool: k8s-prod-rbd
      annotations:
        storageclass.kubernetes.io/is-default-class: "true"