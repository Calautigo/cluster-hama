---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: home-assistant
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  target:
    name: home-assistant-secret
    template:
      type: Opaque
      data:
        INIT_POSTGRES_DBNAME: home-assistant
        INIT_POSTGRES_HOST: pg16-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        VSCODE_TOKEN: "{{ .VSCODE_TOKEN }}"
        RECORDER_DB_URL: "postgresql://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@pg16-rw.database.svc.cluster.local/home-assistant"
  dataFrom:
    - extract:
        key: home-assistant
    - extract:
        key: cloudnative-pg