---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: ceph-csi-rbd
      namespace: ceph-csi
  values:
    controllers:
      frigate:
        annotations:
          secret.reloader.stakater.com/reload: frigate-secret
          configmap.reloader.stakater.com/reload: frigate-configmap

        pod:
          nodeSelector:
            intel.feature.node.kubernetes.io/gpu: "true"

        containers:
          app:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.16.0-beta3

            # env:
            #   YOLO_MODELS: yolov4-416

            envFrom:
              - secretRef:
                  name: frigate-secret

            securityContext:
              privileged: true

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                gpu.intel.com/i915: 1
              limits:
                memory: 6Gi
                gpu.intel.com/i915: 1

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api
                    port: &port 5000
                  initialDelaySeconds: 180
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false

    service:
      app:
        ports:
          http:
            enabled: true
            port: &port 5000
          go2rtc:
            enabled: true
            port: &apiPort 1984
          rtsp:
            enabled: true
            port: 8554
      ws:
        enabled: true
        ports:
          http:
            port: &wsPort 5000
            appProtocol: wss

    route:
      app:
        enabled: true
        parentRefs:
          - name: internal
            namespace: network
        hostnames:
          - "frigate.schwarz47.at"
        rules:
          - backendRefs:
            - port: *port
              name: frigate-app
      ws:
        enabled: true
        parentRefs:
          - name: internal
            namespace: network
        hostnames:
          - "frigate.schwarz47.at"
        rules:
          - backendRefs:
            - port: *wsPort
              name: frigate-ws
      go2rtc:
        enabled: true
        parentRefs:
          - name: internal
            namespace: network
        hostnames:
          - "go2rtc.schwarz47.at"
        rules:
          - backendRefs:
            - port: *apiPort
              name: frigate-app

    persistence:
      media:
        existingClaim: frigate-media
        globalMounts:
          - path: /media

      config:
        existingClaim: frigate-config
        globalMounts:
          - path: /config

      config-file:
        type: configMap
        name: frigate-configmap
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
            readOnly: true

      cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 4Gi
        globalMounts:
          - path: /dev/shm