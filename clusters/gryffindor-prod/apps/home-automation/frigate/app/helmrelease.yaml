---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: ceph-csi-rbd
      namespace: ceph-csi
  values:
    controllers:
      frigate:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.16.0-beta3

            # env:
            #   YOLO_MODELS: yolov4-416

            envFrom:
              - secretRef:
                  name: frigate-secret

            securityContext:
              privileged: true

            resources:
              requests:
                cpu: 500m
                memory: 256Mi
                # nvidia.com/gpu: "1"
              limits:
                cpu: 8000m
                memory: 16Gi
                # nvidia.com/gpu: "1"

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api
                    port: &port 5000
                  initialDelaySeconds: 180
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false

    service:
      app:
        ports:
          http:
            enabled: true
            port: &port 5000
          go2rtc:
            enabled: true
            port: &apiPort 1984
          rtsp:
            enabled: true
            port: 8554

    route:
      frigate:
        enabled: true
        parentRefs:
          - name: internal
            namespace: network
        hostnames: ["frigate.schwarz47.at"]
      go2rtc:
        enabled: true
        parentRefs:
          - name: internal
            namespace: network
        hostnames: ["go2rtc.schwarz47.at"]

    persistence:
      media:
        existingClaim: frigate-media
        globalMounts:
          - path: /media

      config:
        existingClaim: frigate-config
        globalMounts:
          - path: /config

      config-file:
        type: configMap
        name: frigate-configmap
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
            readOnly: true

      cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 4Gi
        globalMounts:
          - path: /dev/shm