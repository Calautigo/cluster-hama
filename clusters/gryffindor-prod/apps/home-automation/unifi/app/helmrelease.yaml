---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unifi
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: ceph-csi-rbd
      namespace: ceph-csi
  values:
    controllers:
      unifi:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: jacobalberty/unifi
              tag: v9.2.87@sha256:150ab9668d3101d0c3762db920a7925082faafa0bead810fafd0713ac1a7b7c6
              pullPolicy: IfNotPresent
            env:
              RUNAS_UID0: "false"
              UNIFI_UID: "1000"
              UNIFI_GID: "1000"
              UNIFI_STDOUT: "true"
              JVM_INIT_HEAP_SIZE:
              JVM_MAX_HEAP_SIZE: 1024M
            resources:
              requests:
                memory: 1Gi
                cpu: 50m
              limits:
                memory: 1250Mi

    service:
      app:
        controller: *app
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          lbipam.cilium.io/ips: 10.100.90.81
        ports:
          http:
            primary: true
            port: 8080
            protocol: HTTP
          https:
            primary: false
            port: &port 8443
            protocol: HTTPS
          portal-http:
            primary: false
            port: 8880
            protocol: HTTP
          portal-https:
            primary: false
            port: 8843
            protocol: HTTPS
          speedtest:
            primary: true
            port: 6789
            protocol: TCP
          stun:
            primary: true
            port: 3478
            protocol: UDP
          syslog:
            primary: true
            port: 5514
            protocol: UDP
          discovery:
            primary: true
            port: 10001
            protocol: UDP

    persistence:
      config:
        enabled: true
        existingClaim: unifi-data
        globalMounts:
          - path: /unifi

    route:
      app:
        hostnames:
          - controller.schwarz47.at
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: unifi
                port: *port