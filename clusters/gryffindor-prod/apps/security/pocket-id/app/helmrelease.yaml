---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pocket-id
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: ceph-csi-rbd
      namespace: storage
  values:
    controllers:
      pocket-id:
        labels:
          postgres: "true"
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 17@sha256:86a1992d46273c58fd4ad95b626081dfaabfe16bd56944675169e406d1a660dd
            envFrom: &envFrom
              - secretRef:
                  name: pocket-id-secret

        containers:
          app:
            image:
              repository: ghcr.io/pocket-id/pocket-id
              tag: v1.8.0@sha256:a18c62cfc2bf9ca8e99d22e37d7dd511d5c07ec44933a9b71075d3e1a8e12b05
            env:
              ANALYTICS_DISABLED: true
              APP_URL: https://id.schwarz47.at
              DB_PROVIDER: postgres
              EMAILS_VERIFIED: true
              KEYS_STORAGE: database
              UI_CONFIG_DISABLED: true
              # LDAP_ENABLED: true
              # LDAP_URL: ldaps://ldap-lb.security.svc.cluster.local
              # LDAP_SKIP_CERT_VERIFY: true
              # LDAP_USER_GROUP_SEARCH_FILTER: (&(objectClass=group)(cn=ID*))
              # LDAP_ATTRIBUTE_USER_UNIQUE_IDENTIFIER: objectGUID
              # LDAP_ATTRIBUTE_GROUP_UNIQUE_IDENTIFIER: objectGUID
              # LDAP_ATTRIBUTE_USER_FIRST_NAME: givenName
              # LDAP_ATTRIBUTE_USER_LAST_NAME: sn
              # LDAP_ATTRIBUTE_USER_USERNAME: sAMAccountName
              # LDAP_ATTRIBUTE_USER_EMAIL: mail
              # LDAP_ATTRIBUTE_GROUP_MEMBER: member
              # LDAP_ATTRIBUTE_GROUP_NAME: cn
              # LDAP_ATTRIBUTE_ADMIN_GROUP: ID-Admin
              SESSION_DURATION: 43800
              TRUST_PROXY: true
              UPLOAD_PATH: /app/data/uploads
              GEOLITE_DB_PATH: /app/data/GeoLite2-City.mmdb
            envFrom: *envFrom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 1411
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: Always

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      data:
        existingClaim: pocket-id-config
        globalMounts:
          - path: /app/data
      tmpfs:
        type: emptyDir
        advancedMounts:
          pocket-id:
            app:
              - path: /tmp
                subPath: tmp

    route:
      app:
        hostnames:
          - id.schwarz47.at
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port