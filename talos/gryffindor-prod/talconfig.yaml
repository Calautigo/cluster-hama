---
# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json

clusterName: &clusterName gryffindor-prod

endpoint: https://api.k8s.gryffindor.prod.schwarz47.at:6443

# renovate: depName=ghcr.io/siderolabs/installer datasource=docker
talosVersion: v1.10.4
# renovate: depName=ghcr.io/siderolabs/kubelet datasource=docker
kubernetesVersion: v1.33.1

additionalApiServerCertSans: &sans
  - api.k8s.gryffindor.prod.schwarz47.at
  - &talosControlplaneVip 10.100.10.60
  - 10.100.10.61
  - 10.100.10.62
  - 10.100.10.63
  - 127.0.0.1 # KubePrism
additionalMachineCertSans: *sans

# Disable built-in Flannel to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: delta.k8s.gryffindor.prod.schwarz47.at
    ipAddress: 10.100.10.61
    installDiskSelector:
      size: "<= 70GB"
    talosImageURL: factory.talos.dev/installer/f8555fe8ea62d71d16fda2fabbd2e6fdc03ba5b168704b723e53ec551d3e7f30
    controlPlane: true
    userVolumes:
      - name: extra
        provisioning:
          diskSelector:
            match: disk.size >= 90u * GB
          maxSize: 500GB
    networkInterfaces:
      - interface: ens18
        dhcp: false
        addresses:
          - 10.100.10.61/16
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.100.0.1"
        mtu: 1500
        vip:
          ip: *talosControlplaneVip
      - interface: ens19
        addresses:
          - 10.44.0.71/16
        routes:
          - network: 10.44.0.0/16
            gateway: 10.44.0.1
        mtu: 1500


  - hostname: blue.k8s.gryffindor.prod.schwarz47.at
    ipAddress: 10.100.10.62
    installDiskSelector:
      size: "<= 70GB"
    talosImageURL: factory.talos.dev/installer/f8555fe8ea62d71d16fda2fabbd2e6fdc03ba5b168704b723e53ec551d3e7f30
    controlPlane: true
    userVolumes:
      - name: extra
        provisioning:
          diskSelector:
            match: disk.size >= 90u * GB
          maxSize: 500GB
    networkInterfaces:
      - interface: ens18
        dhcp: false
        addresses:
          - 10.100.10.62/16
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.100.0.1"
        mtu: 1500
        vip:
          ip: *talosControlplaneVip
      - interface: ens19
        addresses:
          - 10.44.0.72/16
        routes:
          - network: 10.44.0.0/16
            gateway: 10.44.0.1
        mtu: 1500
    kernelModules:
      - name: nvidia
      - name: nvidia_modeset
      - name: nvidia_uvm
      - name: nvidia_drm
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/nvidia-container-toolkit-production
            - siderolabs/nonfree-kmod-nvidia-production



  - hostname: charlie.k8s.gryffindor.prod.schwarz47.at
    ipAddress: 10.100.10.63
    installDiskSelector:
      size: "<= 70GB"
    talosImageURL: factory.talos.dev/installer/f8555fe8ea62d71d16fda2fabbd2e6fdc03ba5b168704b723e53ec551d3e7f30
    controlPlane: true
    userVolumes:
      - name: extra
        provisioning:
          diskSelector:
            match: disk.size >= 90u * GB
          maxSize: 500GB
    networkInterfaces:
      - interface: ens18
        dhcp: false
        addresses:
          - 10.100.10.63/16
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.100.0.1"
        mtu: 1500
        vip:
          ip: *talosControlplaneVip
      - interface: ens19
        addresses:
          - 10.44.0.73/16
        routes:
          - network: 10.44.0.0/16
            gateway: 10.44.0.1
        mtu: 1500

controlPlane:
  nodeLabels:
    topology.kubernetes.io/region: *clusterName
    topology.kubernetes.io/zone: m

  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/i915
          - siderolabs/intel-ucode
          - siderolabs/mei
          - siderolabs/qemu-guest-agent
          - siderolabs/util-linux-tools
      extraKernelArgs:
        - apparmor=0 # Less security, more speed
        - init_on_alloc=0 # Less security, more speed
        - init_on_free=0 # Less security, more speed
        - intel_iommu=on # PCI Passthrough
        - iommu=pt # PCI Passthrough
        - mitigations=off # Less security, more speed
        - security=none # Less security, more speed
        - net.ifnames=1 # Enable predictable NIC naming

  patches:
    # Configure containerd
    - |-
      machine:
        files:
          - op: create
            path: /etc/cri/conf.d/20-customization.part
            content: |
              [plugins]
                [plugins."io.containerd.grpc.v1.cri"]
                  enable_unprivileged_ports = true
                  enable_unprivileged_icmp = true
              [plugins."io.containerd.grpc.v1.cri".containerd]
                discard_unpacked_layers = false
              [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
                discard_unpacked_layers = false

    # Disable search domain everywhere
    - |-
      machine:
        network:
          disableSearchDomain: true

    # Configure DNS server
    - |-
      machine:
        network:
          nameservers:
            - 10.10.10.31

    # # Enable cluster discovery
    # - |-
    #   cluster:
    #     discovery:
    #       enabled: true
    #       registries:
    #         kubernetes:
    #           disabled: false
    #         service:
    #           disabled: true

    # Disable Host DNS
    - |-
      machine:
        features:
          hostDNS:
            enabled: true
            resolveMemberNames: true
            forwardKubeDNSToHost: false

    # Configure kubelet
    - |-
      machine:
        kubelet:
          extraConfig:
            maxPods: 150
          extraMounts:
            - destination: /var/mnt/extra
              type: bind
              source: /var/mnt/extra
              options:
                - rbind
                - rshared
                - rw
          nodeIP:
            validSubnets:
                - 10.100.0.0/16

    # Enable MutatingAdmissionPolicy
    - |-
      cluster:
        apiServer:
          extraArgs:
            runtime-config: admissionregistration.k8s.io/v1alpha1=true
            feature-gates: MutatingAdmissionPolicy=true

    # Configure cluster
    - |-
      cluster:
        allowSchedulingOnControlPlanes: true
        coreDNS:
            disabled: true
        proxy:
          disabled: true
        scheduler:
          config:
            apiVersion: kubescheduler.config.k8s.io/v1
            kind: KubeSchedulerConfiguration
            profiles:
              - schedulerName: default-scheduler
                pluginConfig:
                  - name: PodTopologySpread
                    args:
                      defaultingType: List
                      defaultConstraints:
                        - maxSkew: 1
                          topologyKey: kubernetes.io/hostname
                          whenUnsatisfiable: ScheduleAnyway

    # Configure etcd
    - |-
      cluster:
        etcd:
          advertisedSubnets:
            - 10.100.0.0/16

    # Configure network
    - |-
      cluster:
        network:
          serviceSubnets:
            - 172.17.0.0/16
          podSubnets:
            - 172.16.0.0/16

    # Configure NFS mount options
    - |
      machine:
        files:
          - op: overwrite
            path: /etc/nfsmount.conf
            permissions: 0o644
            content: |
              [ NFSMount_Global_Options ]
              nfsvers=4.2
              hard=True
              noatime=True
              nconnect=16

    # Configure static host entries
    - |-
      machine:
        network:
          extraHostEntries:
            - ip: 10.100.10.60
              aliases:
                - api.k8s.gryffindor.prod.schwarz47.at

    # Configure NTP entries
    - |-
      machine:
        time:
          disabled: false
          servers:
           - /dev/ptp0

    # Configure custom sysctls
    - |-
      machine:
        sysctls:
          fs.inotify.max_user_instances: 8192
          fs.inotify.max_user_watches: 1048576
          net.core.rmem_max: 67108864
          net.core.wmem_max: 67108864
          net.ipv4.tcp_rmem: 4096 87380 33554432
          net.ipv4.tcp_wmem: 4096 65536 33554432
          net.ipv4.tcp_tw_reuse: 1
          net.ipv4.tcp_window_scaling: 1
          net.ipv4.tcp_congestion_control: bbr

    # Configure udev rules
    - |-
      machine:
        udev:
          rules:
            # Intel GPU
            - SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="44", MODE="0660"

    # Disable default API server admission plugins.
    - |-
      - op: remove
        path: /cluster/apiServer/admissionControl

    # Enable K8s Talos API Access
    - |-
      machine:
        features:
          kubernetesTalosAPIAccess:
            enabled: true
            allowedRoles:
              - os:admin
            allowedKubernetesNamespaces:
              - system-upgrade